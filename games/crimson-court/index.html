<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>진홍의 궁정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: 한 열짜리 게임 화면 — 위 캔버스(보스+전투 상자), 아래 명령 버튼. 의도적으로 어두운 단일 테마 */
:root{
  --bg:#0a0608; --panel:#140c0f; --ink:#f3ece4; --dim:#8d7a80;
  --crimson:#c4203a; --gold:#e7c35a; --amber:#ff8c2a; --line:#33232a;
  --font:"DotGothic16","Courier New",monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{margin:0;font-size:15px;font-weight:400;color:var(--gold);letter-spacing:.12em}
.tools{display:flex;gap:6px}
.mini{font:inherit;font-size:12px;background:transparent;color:var(--dim);border:1px solid var(--line);padding:5px 9px;cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--dim)}
.mini:focus-visible,.b:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;background:#000;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;min-height:50px}
.panel.main{grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.panel.main{grid-template-columns:repeat(2,1fr)}}
.b{font:inherit;font-size:16px;letter-spacing:.06em;background:transparent;color:var(--amber);border:2px solid var(--amber);padding:12px 10px;cursor:pointer;text-align:center;line-height:1.35;min-width:0}
.b.sel,.b:hover:not(:disabled){color:var(--gold);border-color:var(--gold);background:#1c1206}
.b.ready{color:var(--gold);border-color:var(--gold)}
.b:disabled{opacity:.32;cursor:not-allowed}
.b .st{display:block;font-size:11px;color:var(--dim);letter-spacing:.04em}
.b .st.spare{color:var(--gold)} .b .st.kill{color:var(--crimson)}
.joy{position:relative;height:190px;border:1px dashed var(--line);background:var(--panel);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.joy-base{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--amber);opacity:.45;pointer-events:none}
.joy.on .joy-base{opacity:1;transition:none}
.joy-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px #1c1206}
.joy.on .joy-knob{background:var(--gold)}
.joy-label{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:var(--dim);pointer-events:none}
[hidden]{display:none!important}
.hint{margin:0;color:var(--dim);font-size:12px;text-align:center;min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <h1>THE CRIMSON COURT</h1>
    <div class="tools">
      <button id="rst" class="mini" type="button">기록 지우기</button>
      <button id="snd" class="mini" type="button">소리 켜짐</button>
    </div>
  </div>
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <div id="panel" class="panel"></div>
  <div id="joy" class="joy" hidden><div class="joy-base"><div class="joy-knob"></div></div><span class="joy-label">패드 아무 곳에나 손가락을 대고 밀기</span></div>
  <p id="hint" class="hint"></p>
</div>

<script>
(()=>{
const W=480,H=360;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const panelEl=document.getElementById('panel'),hintEl=document.getElementById('hint');
const FONT='"DotGothic16","Courier New",monospace';
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let SIL=false;const K=col=>SIL?'#22171b':col;

function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.width*0.75*dpr));
  c.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);window.addEventListener('resize',resize);resize();

/* ---------- 소리 ---------- */
let AC=null,muted=false;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.06,type='square',vol=0.04,slide=0){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}
const SFX={blip:()=>tone(520,0.03,'square',0.018),sel:()=>tone(700,0.05,'square',0.03),
  hurt:()=>tone(190,0.2,'sawtooth',0.06,-120),hit:()=>tone(130,0.28,'triangle',0.1,-80),
  heal:()=>{tone(523,0.08,'sine',0.06);setTimeout(()=>tone(784,0.12,'sine',0.06),80)},
  miss:()=>tone(300,0.12,'square',0.03,-150),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'square',0.04),i*110)),
  over:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.06),i*160))};
document.getElementById('snd').addEventListener('click',e=>{muted=!muted;e.target.textContent=muted?'소리 꺼짐':'소리 켜짐';au();});

/* ---------- 저장 ---------- */
const KEY='crimson-court-v1';
let save={unlocked:1,res:[null,null,null,null,null,null]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.res))save=s;}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
const rstBtn=document.getElementById('rst');let rstArm=0;
rstBtn.addEventListener('click',()=>{if(!rstArm){rstArm=1;rstBtn.textContent='한 번 더 누르면 지워져요';setTimeout(()=>{rstArm=0;rstBtn.textContent='기록 지우기'},3000);return;}
  save={unlocked:1,res:[null,null,null,null,null,null]};store();rstArm=0;rstBtn.textContent='지웠어요';setTimeout(()=>rstBtn.textContent='기록 지우기',1500);toTitle();});

/* ---------- 그리기 도구 ---------- */
function circ(x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function robe(x,y,s,col,trim,wide=30){c.fillStyle=K(col);c.beginPath();c.moveTo(x-wide*s,y);c.quadraticCurveTo(x-17*s,y-38*s,x-12*s,y-70*s);
  c.lineTo(x+12*s,y-70*s);c.quadraticCurveTo(x+17*s,y-38*s,x+wide*s,y);c.closePath();c.fill();
  c.fillStyle=K(trim);c.fillRect(x-wide*s,y-4*s,wide*2*s,4*s);c.fillRect(x-1*s,y-68*s,2*s,64*s);}
function head(x,y,s,skin,eye){c.fillStyle=K(skin);circ(x,y-82*s,11*s);c.fillStyle=K(eye);c.fillRect(x-6*s,y-85*s,3*s,3*s);c.fillRect(x+3*s,y-85*s,3*s,3*s);}
function noteShape(col,sc){c.fillStyle=col;c.beginPath();c.ellipse(-1.5*sc,3*sc,4.2*sc,3.2*sc,-0.4,0,Math.PI*2);c.fill();
  c.fillRect(1.8*sc,-9*sc,1.8*sc,12*sc);c.beginPath();c.moveTo(3.6*sc,-9*sc);c.quadraticCurveTo(8*sc,-6*sc,6.5*sc,-1*sc);c.lineTo(3.6*sc,-5*sc);c.closePath();c.fill();}
function noteAt(x,y,col,sc,ph){c.save();c.translate(x,y);c.rotate(Math.sin(ph)*0.2);noteShape(K(col),sc);c.restore();}
function heartShape(x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y+5*s);c.bezierCurveTo(x-8*s,y-1*s,x-5*s,y-7*s,x,y-3*s);
  c.bezierCurveTo(x+5*s,y-7*s,x+8*s,y-1*s,x,y+5*s);c.fill();}
function rrect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function wrap(str,maxW){const out=[];let line='';for(const ch of str){const test=line+ch;
  if(c.measureText(test).width>maxW&&line){const sp=line.lastIndexOf(' ');if(sp>0){out.push(line.slice(0,sp));line=line.slice(sp+1)+ch;}else{out.push(line);line=ch;}}
  else line=test;}if(line)out.push(line);return out;}

/* ---------- 보스 그림 ---------- */
const FIG={
piper(x,y,s,t){y+=Math.sin(t*2.2)*2*s;
  robe(x,y,s,'#5b2f8c','#c9a6ff',28);head(x,y,s,'#efe2f6','#2a1238');
  c.fillStyle=K('#3d1f63');c.beginPath();c.moveTo(x-13*s,y-86*s);c.lineTo(x+2*s,y-106*s);c.lineTo(x+13*s,y-86*s);c.closePath();c.fill();
  c.strokeStyle=K('#c9a6ff');c.lineWidth=1.5*s;c.beginPath();c.moveTo(x+2*s,y-105*s);c.quadraticCurveTo(x+16*s,y-114*s,x+24*s,y-106*s);c.stroke();
  c.strokeStyle=K('#d9c08a');c.lineWidth=3.5*s;c.lineCap='round';c.beginPath();c.moveTo(x+4*s,y-77*s);c.lineTo(x+40*s,y-60*s);c.stroke();c.lineCap='butt';
  c.fillStyle=K('#3a2a10');for(let i=1;i<4;i++)circ(x+(4+i*9)*s,y-(77-i*4.2)*s,0.9*s);
  if(!SIL)for(let i=0;i<3;i++){const ph=t*1.3+i*2.1;noteAt(x+(46+Math.cos(ph)*10+i*8)*s,y-(72+Math.sin(ph*1.4)*10+i*8)*s,'#b689f0',s*0.9,ph);}
},
keeper(x,y,s,t){y+=Math.sin(t*1.6+1)*1.6*s;
  if(!SIL){const gl=c.createRadialGradient(x-30*s,y-30*s,1,x-30*s,y-30*s,16*s);gl.addColorStop(0,'rgba(255,190,90,.55)');gl.addColorStop(1,'rgba(255,190,90,0)');c.fillStyle=gl;circ(x-30*s,y-30*s,16*s);}
  robe(x,y,s,'#3b3f4a','#c9a24a',32);
  c.fillStyle=K('#262931');circ(x,y-83*s,15*s);head(x,y,s,'#d8cfc2','#111');
  c.strokeStyle=K('#6b5a3a');c.lineWidth=1.5*s;c.beginPath();c.moveTo(x-30*s,y-48*s);c.lineTo(x-30*s,y-37*s);c.stroke();
  c.fillStyle=K('#ffb24a');c.fillRect(x-34*s,y-37*s,8*s,10*s);c.fillStyle=K('#4a3a26');c.fillRect(x-35*s,y-38*s,10*s,2*s);c.fillRect(x-35*s,y-27*s,10*s,2*s);
  const rx=x+26*s,ry=y-38*s;c.strokeStyle=K('#e7c35a');c.lineWidth=2*s;c.beginPath();c.arc(rx,ry,7*s,0,Math.PI*2);c.stroke();
  for(let i=0;i<5;i++){const a=Math.PI*0.2+i*0.33+Math.sin(t*3+i)*0.12;const kx=rx+Math.cos(a)*7*s,ky=ry+Math.sin(a)*7*s,ex=kx+Math.cos(a)*13*s,ey=ky+Math.sin(a)*13*s;
    c.beginPath();c.moveTo(kx,ky);c.lineTo(ex,ey);c.stroke();c.fillStyle=K('#e7c35a');c.fillRect(ex-1.5*s,ey-1.5*s,3*s,3*s);}
},
jester(x,y,s,t){y+=Math.abs(Math.sin(t*3))*-4*s;
  robe(x,y,s,'#e8b923','#1a1416',30);
  c.fillStyle=K('#1a1416');for(let r=0;r<3;r++)for(let k=-1;k<=1;k++){const dx=(k*10+(r%2?5:0))*s,dy=(18+r*15)*s,d=4*s;
    c.beginPath();c.moveTo(x+dx,y-dy-d);c.lineTo(x+dx+d,y-dy);c.lineTo(x+dx,y-dy+d);c.lineTo(x+dx-d,y-dy);c.closePath();c.fill();}
  c.fillStyle=K('#f6f1e7');circ(x,y-82*s,11*s);c.fillStyle=K('#1a1416');
  for(const ex of[-4.5,4.5]){c.beginPath();c.moveTo(x+ex*s,y-88*s);c.lineTo(x+(ex+2)*s,y-85*s);c.lineTo(x+ex*s,y-82*s);c.lineTo(x+(ex-2)*s,y-85*s);c.closePath();c.fill();}
  c.fillStyle=K('#d23a3a');circ(x-7*s,y-79*s,1.8*s);circ(x+7*s,y-79*s,1.8*s);
  c.strokeStyle=K('#1a1416');c.lineWidth=1.2*s;c.beginPath();c.arc(x,y-80*s,4*s,0.2,Math.PI-0.2);c.stroke();
  const cols=['#1a1416','#e8b923','#1a1416'],bases=[[-14,-4],[-5,5],[4,14]],tips=[[-27,-100],[0,-114],[27,-100]];
  for(let i=0;i<3;i++){const sw=Math.sin(t*4+i)*3;c.fillStyle=K(cols[i]);c.beginPath();c.moveTo(x+bases[i][0]*s,y-90*s);c.lineTo(x+(tips[i][0]+sw)*s,y+(tips[i][1]+Math.abs(sw))*s);c.lineTo(x+bases[i][1]*s,y-90*s);c.closePath();c.fill();
    c.fillStyle=K('#f2d03b');circ(x+(tips[i][0]+sw)*s,y+(tips[i][1]+Math.abs(sw))*s,2.8*s);}
  c.fillStyle=K('#e8b923');c.fillRect(x-14*s,y-92*s,28*s,4*s);
},
witch(x,y,s,t){y+=Math.sin(t*2.6)*2*s;
  if(!SIL){const cs=['#ff3b1f','#ff7a2a','#ffc34d'];for(let k=0;k<3;k++){c.globalAlpha=0.16+0.06*k;c.fillStyle=cs[k];c.beginPath();
      c.ellipse(x+Math.sin(t*5+k)*2*s,y-52*s-k*4*s,(40-k*10)*s*(1+0.05*Math.sin(t*8+k)),(62-k*13)*s,0,0,Math.PI*2);c.fill();}
    c.globalAlpha=1;c.fillStyle='#ffc34d';for(let i=0;i<5;i++){const p=(t*0.6+i/5)%1;circ(x+Math.sin(i*7+t)*30*s,y-(10+p*100)*s,(1.6-p)*s);}}
  robe(x,y,s,'#7a1d16','#ff8c2a',30);
  c.fillStyle=K('#4a0f0b');c.fillRect(x-13*s,y-86*s,5*s,22*s);c.fillRect(x+8*s,y-86*s,5*s,22*s);
  head(x,y,s,'#efd6c4','#3a0a06');
  const tip=Math.sin(t*2)*3;c.fillStyle=K('#2a0d0a');c.beginPath();c.ellipse(x,y-91*s,21*s,4*s,0,0,Math.PI*2);c.fill();
  c.beginPath();c.moveTo(x-12*s,y-91*s);c.lineTo(x+(6+tip)*s,y-128*s);c.lineTo(x+12*s,y-91*s);c.closePath();c.fill();
  c.fillStyle=K('#ff8c2a');c.fillRect(x-11*s,y-96*s,22*s,3*s);
},
queen(x,y,s,t){y+=Math.sin(t*1.4+2)*1.5*s;
  c.fillStyle=K('#2a2230');c.beginPath();c.arc(x,y-80*s,19*s,Math.PI,0);c.fill();
  robe(x,y,s,'#141016','#efe9f2',38);
  for(let i=-3;i<3;i++)for(let r=0;r<2;r++){c.fillStyle=K((i+r)%2?'#efe9f2':'#141016');c.fillRect(x+i*4*s,y-(72-r*4)*s,4*s,4*s);}
  head(x,y,s,'#f1eef4','#141016');c.fillStyle=K('#7a1020');c.fillRect(x-2*s,y-77*s,4*s,1.6*s);
  c.fillStyle=K('#d9d4e0');c.beginPath();c.moveTo(x-11*s,y-90*s);
  for(let i=0;i<5;i++){const px=x+(-11+i*5.5)*s;c.lineTo(px,y-(i%2?96:104)*s);c.lineTo(px+2.75*s,y-92*s);}c.lineTo(x+11*s,y-90*s);c.closePath();c.fill();
  c.fillStyle=K('#141016');circ(x,y-95*s,1.8*s);
},
king(x,y,s,t){y+=Math.sin(t*1.2)*1.5*s;
  c.fillStyle=K('#5c0b18');c.beginPath();c.moveTo(x-16*s,y-70*s);c.lineTo(x-44*s,y);c.lineTo(x+44*s,y);c.lineTo(x+16*s,y-70*s);c.closePath();c.fill();
  robe(x,y,s,'#a3162c','#e7c35a',30);
  c.fillStyle=K('#1c070b');circ(x,y-82*s,11*s);
  const gl=0.6+0.4*Math.sin(t*3);c.fillStyle=SIL?K(''):`rgba(255,207,107,${gl})`;c.fillRect(x-6*s,y-85*s,3*s,2*s);c.fillRect(x+3*s,y-85*s,3*s,2*s);
  c.fillStyle=K('#e7c35a');c.beginPath();c.moveTo(x-12*s,y-90*s);c.lineTo(x-12*s,y-106*s);c.lineTo(x-6*s,y-98*s);c.lineTo(x,y-114*s);c.lineTo(x+6*s,y-98*s);c.lineTo(x+12*s,y-106*s);c.lineTo(x+12*s,y-90*s);c.closePath();c.fill();
  c.fillStyle=K('#c4203a');circ(x,y-96*s,2.4*s);
  c.strokeStyle=K('#e7c35a');c.lineWidth=2*s;c.beginPath();c.moveTo(x+24*s,y-18*s);c.lineTo(x+31*s,y-76*s);c.stroke();c.fillStyle=K('#c4203a');circ(x+31*s,y-79*s,3.5*s);
}};

/* ---------- 보스 데이터 (가사 속 장면을 모티브로 한 오리지널 대사) ---------- */
const BOSSES=[
{name:'보라빛 피리꾼',en:'PURPLE PIPER',fig:FIG.piper,hp:60,atk:3,pats:['lullaby','choir'],
 intro:['* 안개 낀 궁정 입구.','* 피리 소리를 따라 어디선가 합창이 들려온다.','* 보라빛 피리꾼이 길을 막아선다!'],
 flavor:['* 합창단이 아주 낮게 노래한다.','* 알아들을 수 없는 옛말로 된 노래다.','* 피리꾼이 다음 자장가를 고른다.','* 눈꺼풀이 조금 무거워진다.'],
 says:['자장가가 세 곡 있어. 끝까지 들어줄래?','합창단, 준비.','졸리지? 그게 정상이야.','이건 아주 오래된 노래란다.'],
 check:'* 보라빛 피리꾼 — 공격 3. 연주하면 합창단이 따라 부른다. 연보라 음표에 맞으면 졸음이 와서 느려진다.',

const joyEl=document.getElementById('joy'),joyBase=joyEl.querySelector('.joy-base'),joyKnob=joyEl.querySelector('.joy-knob');
const JOY={on:false,id:null,ox:0,oy:0,x:0,y:0};const JR=55;
let TOUCH=false;try{TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;}catch(e){}
window.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!TOUCH){TOUCH=true;syncJoy();}},true);
function joyReset(){JOY.on=false;JOY.id=null;JOY.x=JOY.y=0;joyEl.classList.remove('on');joyBase.style.left=joyBase.style.top='';joyKnob.style.transform='';}
function joyMove(e){const r=joyEl.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let dx=px-JOY.ox,dy=py-JOY.oy,d=Math.hypot(dx,dy);
  if(d>JR){JOY.ox=px-dx/d*JR;JOY.oy=py-dy/d*JR;dx=px-JOY.ox;dy=py-JOY.oy;d=JR;joyBase.style.left=JOY.ox+'px';joyBase.style.top=JOY.oy+'px';}
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;const m=d/JR;
  if(m<0.12){JOY.x=JOY.y=0;}else{const k=Math.min(1,(m-0.12)/0.7)/m;JOY.x=dx/JR*k;JOY.y=dy/JR*k;}}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();au();if(JOY.on)return;try{joyEl.setPointerCapture(e.pointerId)}catch(_){}
  const r=joyEl.getBoundingClientRect();JOY.on=true;JOY.id=e.pointerId;JOY.ox=e.clientX-r.left;JOY.oy=e.clientY-r.top;
  joyBase.style.left=JOY.ox+'px';joyBase.style.top=JOY.oy+'px';joyEl.classList.add('on');joyMove(e);});
joyEl.addEventListener('pointermove',e=>{if(JOY.on&&e.pointerId===JOY.id){e.preventDefault();joyMove(e);}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joyEl.addEventListener(t,e=>{if(e.pointerId===JOY.id)joyReset();}));
joyEl.addEventListener('contextmenu',e=>e.preventDefault());
function syncJoy(){const show=G.scene==='enemy'&&TOUCH;if(joyEl.hidden===!show)return;joyEl.hidden=!show;panelEl.hidden=show;if(!show)joyReset();
  if(G.scene==='enemy')hintEl.textContent=TOUCH?'아래 패드를 밀어서 하트를 움직이세요 · 화면 드래그도 됩니다':'방향키(WASD)나 화면 드래그로 하트를 움직여 피하세요';}

let pbtns=[],psel=0;
function panel(items,cls='',hint=''){panelEl.className='panel '+cls;panelEl.innerHTML='';pbtns=[];
  items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='b '+(it.cls||'');b.innerHTML=it.label;if(it.disabled)b.disabled=true;
    b.addEventListener('click',()=>{au();b.blur();if(b.disabled)return;SFX.sel();it.on();});
    b.addEventListener('pointerenter',()=>{if(!b.disabled){psel=i;mark();}});panelEl.appendChild(b);pbtns.push(b);});
  psel=Math.max(0,pbtns.findIndex(b=>!b.disabled));mark();hintEl.textContent=hint;rstBtn.hidden=G.scene!=='title';syncJoy();}
function mark(){pbtns.forEach((b,i)=>b.classList.toggle('sel',i===psel));}
function moveSel(d){if(!pbtns.length)return;let i=psel;for(let k=0;k<pbtns.length;k++){i=(i+d+pbtns.length)%pbtns.length;if(!pbtns[i].disabled)break;}psel=i;mark();SFX.blip();}

/* ---------- 입력 ---------- */
const held={};
window.addEventListener('keydown',e=>{const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(k))e.preventDefault();
  held[k.toLowerCase()]=true;au();
  if(G.scene==='enemy')return;
  if(k==='ArrowRight'||k==='ArrowDown')moveSel(1);
  else if(k==='ArrowLeft'||k==='ArrowUp')moveSel(-1);
  else if((k==='z'||k==='Z'||k==='Enter'||k===' ')&&!e.repeat)confirmKey();
  else if((k==='x'||k==='X'||k==='Escape')&&G.back)G.back();});
window.addEventListener('keyup',e=>{held[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{for(const k in held)held[k]=false;});
function confirmKey(){if(G.scene==='text')return advance();if(G.scene==='fight')return stopFight();
  const b=pbtns[psel];if(b&&!b.disabled)b.click();}
let drag=null;
cv.addEventListener('pointerdown',e=>{au();try{cv.setPointerCapture(e.pointerId)}catch(_){}drag={x:e.clientX,y:e.clientY};
  if(G.scene==='text')advance();else if(G.scene==='fight')stopFight();});
cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect(),s=W/r.width;
  const dx=(e.clientX-drag.x)*s,dy=(e.clientY-drag.y)*s;drag.x=e.clientX;drag.y=e.clientY;
  if(G.scene==='enemy'){const m=G.slow>0?0.5:1.15;G.heart.x+=dx*m;G.heart.y+=dy*m;}});
const up=()=>drag=null;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function add(o){const b=Object.assign({t:0,vx:0,vy:0,r:5,a:0,va:0,warn:0},o);G.bullets.push(b);return b;}
const count=k=>G.bullets.filter(b=>b.k===k).length;
function note(B,col,sp=72){const x0=rand(B.x+8,B.x+B.w-8);add({k:'note',c:col,ox:x0,x:x0,y:B.y-8,vy:sp,r:5,ph:rand(0,6),
  fn:(b,dt)=>{b.y+=b.vy*dt;b.x=b.ox+Math.sin(b.t*3+b.ph)*16;}});}
function noteWall(B,S,n){const dir=n%2?1:-1,gy=rand(B.y+22,B.y+B.h-22),fx=dir>0?B.x-10:B.x+B.w+10;
  for(let y=B.y+7;y<B.y+B.h;y+=13){if(Math.abs(y-gy)<21)continue;add({k:'note',c:'#b689f0',x:fx,y,vx:dir*82,r:5});}}
function keyRain(B){add({k:'key',c:'#e7c35a',x:rand(B.x-10,B.x+B.w+10),y:B.y-10,vx:rand(-25,25),vy:rand(85,115),r:5,va:rand(-4,4),a:rand(0,6)});}
function gate(B,S,n){const gx=rand(B.x+26,B.x+B.w-26),gw=22,down=n%2===1,y0=down?B.y-10:B.y+B.h+2,vy=down?52:-52;
  add({k:'bar',x:B.x-4,y:y0,rw:gx-gw-(B.x-4),rh:8,vy,life:4});add({k:'bar',x:gx+gw,y:y0,rw:B.x+B.w+4-(gx+gw),rh:8,vy,life:4});}
function bounce(b,dt){b.x+=b.vx*dt;b.y+=b.vy*dt;const B=G.box,r=b.r+2;
  if(b.x<B.x+r){b.x=B.x+r;b.vx=Math.abs(b.vx);}if(b.x>B.x+B.w-r){b.x=B.x+B.w-r;b.vx=-Math.abs(b.vx);}
  if(b.y<B.y+r){b.y=B.y+r;b.vy=Math.abs(b.vy);}if(b.y>B.y+B.h-r){b.y=B.y+B.h-r;b.vy=-Math.abs(b.vy);}}
function ball(B){const h=G.heart,x=h.x<B.x+B.w/2?B.x+B.w-12:B.x+12,y=h.y<B.y+B.h/2?B.y+B.h-12:B.y+12,a=rand(0,Math.PI*2),sp=rand(78,100);
  add({k:'ball',c:pick(['#f2d03b','#f7f1e3','#e0503c']),x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:6,warn:0.4,fn:bounce});}
function cardFan(B,S,n){const ox=B.x+B.w*(0.2+0.6*Math.random()),oy=B.y-6;
  for(let i=-2;i<=2;i++){const a=Math.PI/2+i*0.32+(n%2?0.16:0);add({k:'card',x:ox,y:oy,vx:Math.cos(a)*95,vy:Math.sin(a)*95,r:5,va:6});}}
function pillar(B){const x=Math.random()<0.45?G.heart.x:rand(B.x+12,B.x+B.w-12);add({k:'pillar',x:x-11,y:B.y-4,rw:22,rh:B.h+8,warn:0.6,life:1.05});}
function ember(B){const cx0=B.x+B.w/2,cy0=B.y+B.h/2,a=rand(0,Math.PI*2),R=Math.max(B.w,B.h)*0.72,x=cx0+Math.cos(a)*R,y=cy0+Math.sin(a)*R;
  const dx=G.heart.x-x,dy=G.heart.y-y,d=Math.hypot(dx,dy)||1;add({k:'flame',x,y,vx:dx/d*102,vy:dy/d*102,r:5,life:4});}
function rook(B,S,n){const both=G.lv>=5?false:n%3===0,hz=n%2===0;
  const mk=h=>{if(h){const y=Math.random()<0.5?G.heart.y:rand(B.y+10,B.y+B.h-10);add({k:'beam',x:B.x-4,y:y-7,rw:B.w+8,rh:14,warn:0.55,life:0.95});}
    else{const x=Math.random()<0.5?G.heart.x:rand(B.x+10,B.x+B.w-10);add({k:'beam',x:x-7,y:B.y-4,rw:14,rh:B.h+8,warn:0.55,life:0.95});}};
  mk(hz);if(both)mk(!hz);}
function pawnRow(B){const slots=Math.floor((B.w-8)/20),gap=Math.floor(rand(0,slots-1));
  for(let i=0;i<slots;i++){if(i===gap||i===gap+1)continue;add({k:'pawn',x:B.x+14+i*20,y:B.y+B.h+12,r:6,st:0,life:6,
    fn:(b,dt)=>{b.st+=dt;if(b.st>=0.32){b.st-=0.32;b.y-=16;}}});}}
function burst(B){const side=Math.floor(rand(0,4));let x,y;
  if(side===0){x=rand(B.x,B.x+B.w);y=B.y;}else if(side===1){x=rand(B.x,B.x+B.w);y=B.y+B.h;}else if(side===2){x=B.x;y=rand(B.y,B.y+B.h);}else{x=B.x+B.w;y=rand(B.y,B.y+B.h);}
  const off=rand(0,1);for(let i=0;i<11;i++){const a=off+i*Math.PI*2/11;add({k:'orb',c:'#d42c45',x,y,vx:Math.cos(a)*68,vy:Math.sin(a)*68,r:4,life:4});}}
function spiral(B,S){S.ang=(S.ang||0)+0.5;const x=B.x+B.w/2,y=B.y+B.h/2-18;
  for(const k of[0,Math.PI]){const a=S.ang+k;add({k:'orb',c:'#d42c45',x,y,vx:Math.cos(a)*70,vy:Math.sin(a)*70,r:4,life:4});}}

/* ---------- 가사 모티브 탄막 ---------- */
function ring(x,y,col,sp,ga,gw,warn=0){return add({k:'ring',c:col,x,y,R:4,sp,ga,gw,r:0,warn,life:4.4,fn:(b,dt)=>{if(b.warn<=0){if(!b.rang&&b.bell){b.rang=true;tone(196,0.6,'sine',0.07);}b.R+=b.sp*dt;}}});}
function lullaby(B,S,n){const i=n%3,x0=B.x+B.w*[0.2,0.5,0.8][i];
  add({k:'note',c:'#cfa8ff',eff:'slow',ox:x0,x:x0,y:B.y-8,vy:60,r:5,ph:n*0.7,fq:[1.8,2.6,3.4][i],
    fn:(b,dt)=>{b.y+=b.vy*dt;b.x=b.ox+Math.sin(b.t*b.fq+b.ph)*22;}});}
function choir(B,S,n,col='#b689f0'){const ox=[B.x+20,B.x+B.w/2,B.x+B.w-20][n%3];ring(ox,B.y+B.h+6,col,62,rand(-Math.PI*0.8,-Math.PI*0.2),0.85);}
function shutter(B,S,n){const vert=n%2===1,g=vert?rand(B.y+25,B.y+B.h-25):rand(B.x+25,B.x+B.w-25),half=16;
  const mk=side=>add({k:'shutter',vert,side,g,half,x:B.x,y:B.y,rw:0.1,rh:0.1,warn:0.55,life:1.6,fn:b=>{const T=b.t-0.55,p=T<0?0:T<0.3?T/0.3:T<0.85?1:Math.max(0,1-(T-0.85)/0.25);
    if(b.vert){b.x=B.x-4;b.rw=B.w+8;if(b.side<0){b.y=B.y-4;b.rh=Math.max(0.1,(b.g-b.half-b.y)*p);}else{b.rh=Math.max(0.1,(B.y+B.h+4-(b.g+b.half))*p);b.y=B.y+B.h+4-b.rh;}}
    else{b.y=B.y-4;b.rh=B.h+8;if(b.side<0){b.x=B.x-4;b.rw=Math.max(0.1,(b.g-b.half-b.x)*p);}else{b.rw=Math.max(0.1,(B.x+B.w+4-(b.g+b.half))*p);b.x=B.x+B.w+4-b.rw;}}}});
  mk(-1);mk(1);}
function moonsInit(B,S){S.rot=0;S.cx=B.x+B.w/2;S.cy=B.y+B.h/2;
  for(let arm=0;arm<3;arm++)for(let j=0;j<6;j++){const moon=j===5;add({k:moon?'moon':'link',arm,j,r:moon?8:3.5,x:S.cx,y:S.cy,chain:true,warn:0.5,
    fn:(b,dt)=>{if(!b.chain){b.x+=b.vx*dt;b.y+=b.vy*dt;return;}const a=S.rot+b.arm*Math.PI*2/3,rr=(6+b.j*16)*(1+0.14*Math.sin(S.t*2));b.x=S.cx+Math.cos(a)*rr;b.y=S.cy+Math.sin(a)*rr;}});}}
function moonsTick(B,S,dt){S.rot+=1.1*dt;if(S.t>4.3&&!S.shot){S.shot=true;tone(880,0.3,'triangle',0.05,-400);
  G.bullets.forEach(b=>{if(b.chain){b.chain=false;const a=Math.atan2(b.y-S.cy,b.x-S.cx),sp=55+b.j*14;b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.life=b.t+3;b.k=b.k==='moon'?'shard':b.k;}});}}
function puppetDrop(B){const x=rand(B.x+15,B.x+B.w-15),depth=rand(B.y+30,B.y+B.h-25);
  add({k:'puppet',x,y:B.y-20,top:B.y-10,depth,r:6,life:5,warn:0.3,fn:(b,dt)=>{if(!b.cut){b.y=b.t<0.6?b.y+(b.depth-b.y)*Math.min(1,dt*6):b.depth+Math.sin(b.t*6)*6;if(b.t>2.4){b.cut=true;b.vy=40;}}
    else{b.vy+=380*dt;b.y+=b.vy*dt;}}});}
function mirrorInit(B){const h=G.heart,cx0=B.x+B.w/2,cy0=B.y+B.h/2;
  for(const m of[0,1])add({k:'puppet',mirror:m,x:2*cx0-h.x,y:m?2*cy0-h.y:h.y,top:B.y-10,r:6,warn:0.7,
    fn:(b,dt)=>{const tx=2*cx0-G.heart.x,ty=b.mirror?2*cy0-G.heart.y:G.heart.y,k=Math.min(1,dt*2.2);b.x+=(tx-b.x)*k;b.y+=(ty-b.y)*k;}});}
function slowCards(B){const x=rand(B.x+10,B.x+B.w-10);add({k:'card',x,y:B.y-8,vy:70,vx:rand(-15,15),r:5,va:4});}
function sigil(B){const x=Math.random()<0.5?G.heart.x:rand(B.x+20,B.x+B.w-20),y=Math.random()<0.5?G.heart.y:rand(B.y+20,B.y+B.h-20);
  add({k:'sigil',x,y,r:20,warn:0.75,life:1.05,fn:b=>{if(b.warn<=0&&!b.fired){b.fired=true;tone(150,0.2,'sawtooth',0.04,-60);
    for(let i=0;i<8;i++){const a=i*Math.PI/4+0.2;add({k:'flame',x:b.x,y:b.y,vx:Math.cos(a)*95,vy:Math.sin(a)*95,r:5,life:3});}}}});}
function boomer(B){add({k:'flame',x:B.x+B.w/2+rand(-30,30),y:B.y-8,vx:rand(-70,70),vy:rand(110,165),ay:-118,r:5,life:3.4,
  fn:(b,dt)=>{b.vy+=b.ay*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;}});}
function mournRow(B){const slots=Math.floor((B.w-8)/20),gap=Math.floor(rand(0,slots-1));
  for(let i=0;i<slots;i++){if(i===gap||i===gap+1)continue;add({k:'mourner',x:B.x+14+i*20,y:B.y-12,r:6,life:7});}}
function marchTick(B,S,dt){S.beat=(S.beat||0)+dt;if(S.beat>=0.5){S.beat-=0.5;tone(70,0.2,'sine',0.13);G.bullets.forEach(b=>{if(b.k==='mourner')b.y+=15;});}}
function bell(B,S,n,col='#c9a24a'){const x=rand(B.x+20,B.x+B.w-20),y=B.y+10;add({k:'bell',x,y,r:0,harmless:true,life:0.9,fn:b=>{b.sw=Math.sin(b.t*14)*0.4;}});
  const rg=ring(x,y,col,70,rand(Math.PI*0.2,Math.PI*0.8),0.75,0.35);rg.bell=true;}
function wheelInit(B,S){S.rot=0;S.cx=B.x+B.w/2;S.cy=B.y+B.h/2;
  for(let s=0;s<4;s++)for(let j=1;j<=8;j++)add({k:'orb',c:'#d42c45',spoke:s,j,r:4,x:S.cx,y:S.cy,warn:0.7,
    fn:b=>{const a=S.rot+b.spoke*Math.PI/2,rr=b.j*13;b.x=S.cx+Math.cos(a)*rr;b.y=S.cy+Math.sin(a)*rr;}});}
function grain(B,S){const a=rand(0,Math.PI*2);add({k:'orb',c:'#e7c35a',x:S.cx,y:S.cy,vx:Math.cos(a)*58,vy:Math.sin(a)*58,r:3.5,life:3});}

const PAT={
  lullaby:{w:200,h:120,sp:[[0.2,lullaby]]},
  choir:{w:210,h:120,sp:[[0.85,choir]]},
  shutters:{w:200,h:120,sp:[[1.3,shutter]]},
  moons:{w:150,h:120,heart:'corner',init:moonsInit,tick:moonsTick,sp:[]},
  puppetShow:{w:200,h:120,sp:[[0.55,puppetDrop]]},
  mirror:{w:190,h:120,heart:'corner',init:mirrorInit,sp:[[0.75,slowCards]]},
  summon:{w:210,h:120,sp:[[0.75,sigil]]},
  returnFire:{w:200,h:120,heart:'bottom',sp:[[0.22,boomer]]},
  march:{w:200,h:120,tick:marchTick,sp:[[1.5,mournRow]]},
  bells:{w:190,h:120,heart:'bottom',sp:[[1.0,bell]]},
  wheel:{w:150,h:120,heart:'diag',init:wheelInit,tick:(B,S,dt)=>{S.rot+=dt*(S.t<3.2?0.9:-1.15);},sp:[[0.6,grain]]},
  echo:{w:200,h:120,sp:[[0.2,(B,S)=>{const ph=Math.min(2,Math.floor(S.t/1.7));S.k=(S.k||0)+1;
    if(ph===0){if(S.k%5===0)choir(B,S,S.k/5,'#d42c45');}else if(ph===1){if(S.k%4===0)puppetDrop(B);}else if(S.k%6===0)bell(B,S,0,'#e7c35a');}]]},
  spiral:{w:150,h:120,heart:'bottom',sp:[[0.12,spiral]]}};

/* ---------- 흐름 ---------- */
function say(pages,done){G.scene='text';G.back=null;G.msg={pages,i:0,shown:0,done};panel([{label:'계속 ▶',on:advance}],'','Z · Enter · 화면 탭으로 넘기기');}
function advance(){const m=G.msg;if(!m)return;const p=m.pages[m.i];if(m.shown<p.length){m.shown=p.length;return;}
  m.i++;m.shown=0;if(m.i>=m.pages.length){G.msg=null;m.done&&m.done();}}
function toTitle(){G.scene='title';G.boss=null;G.bullets=[];G.pat=null;G.timers=[];G.back=null;
  panel(BOSSES.map((b,i)=>{const r=save.res[i],locked=i>=save.unlocked;
    return{label:`LV${i+1} · ${b.name}<span class="st ${r||''}">${locked?'잠김':r==='spare'?'용서함':r==='kill'?'격파함':'도전 가능'}</span>`,disabled:locked,on:()=>startLevel(i)};}),
  '','레벨을 고르세요 · 방향키 + Z 또는 터치');}
function startLevel(i){const b=BOSSES[i];Object.assign(G,{lv:i,boss:b,hp:20,items:ITEMS.map(x=>({...x})),bhp:b.hp,spare:0,turn:0,bullets:[],pat:null,
  bossA:1,bossAT:1,pops:[],timers:[],fight:null,shake:0,slash:0});G.box={...DBOX};say(b.intro,()=>toMenu(true));}
function toMenu(fresh){const b=G.boss;G.scene='menu';G.pat=null;G.bullets=[];G.back=null;
  if(fresh)G.flavor=G.spare>=100?b.ready:pick(b.flavor);
  panel([{label:'공격',on:startFight},{label:'행동',on:actMenu},{label:'아이템',on:itemMenu,disabled:!G.items.length},
    {label:'자비',on:mercyMenu,cls:G.spare>=100?'ready':''}],'main','');}
function sub(prompt,items){G.scene='sub';G.prompt=prompt;G.back=()=>{SFX.blip();toMenu(false);};panel([...items,{label:'뒤로',on:G.back}],'','X 또는 Esc로 뒤로');}
function actMenu(){const b=G.boss;sub('* 무엇을 할까?',[{label:'살펴보기',on:()=>say([b.check],enemyTurn)},
  ...b.acts.map(a=>({label:a.n,on:()=>{let v=a.v,t=a.t;if(a.fn)[v,t]=a.fn();const was=G.spare>=100;G.spare=Math.min(100,G.spare+v);
    const pages=t.slice();if(!was&&G.spare>=100)pages.push(b.ready);say(pages,enemyTurn);}}))]);}
function itemMenu(){sub('* 무엇을 먹을까?',G.items.map((it,i)=>({label:`${it.n} <span class="st">HP +${it.h}</span>`,on:()=>{
  G.items.splice(i,1);const before=G.hp;G.hp=Math.min(G.maxhp,G.hp+it.h);SFX.heal();
  say([`* ${it.n}을(를) 먹었다.`,G.hp>=G.maxhp?'* HP가 가득 찼다.':`* HP가 ${G.hp-before} 회복되었다.`],enemyTurn);}})));}
function mercyMenu(){sub('* 자비를 베풀까?',[{label:'용서하기',cls:G.spare>=100?'ready':'',on:()=>{
  if(G.spare>=100)win('spare');else say(['* 너는 용서를 건넸다.','* 하지만 아직은 받아들이지 않는다.'],enemyTurn);}}]);}
function startFight(){G.scene='fight';G.back=null;G.fight={x:DBOX.x+14,v:(DBOX.w-28)/1.25,stopped:false};
  panel([{label:'지금!',on:stopFight}],'','커서가 가운데 올 때 Z · 탭');}
function stopFight(){const F=G.fight;if(!F||F.stopped)return;F.stopped=true;G.scene='fightdone';panel([]);
  const cxm=DBOX.x+DBOX.w/2,half=DBOX.w/2-14,acc=clamp(1-Math.abs(F.x-cxm)/half,0,1);
  let dmg=Math.round((16+G.lv*2)*(0.35+0.85*acc));if(acc>0.93)dmg=Math.round(dmg*1.25);
  G.slash=0.4;later(0.28,()=>{G.bhp=Math.max(0,G.bhp-dmg);G.shake=0.5;SFX.hit();G.pops.push({txt:String(dmg),x:240,y:70,t:0,c:'#ff3b4e'});});
  later(1.05,()=>{if(G.bhp<=0)win('kill');else enemyTurn();});}
function fightMiss(){const F=G.fight;F.stopped=true;G.scene='fightdone';panel([]);SFX.miss();G.pops.push({txt:'MISS',x:240,y:70,t:0,c:'#cdbfc5'});later(0.8,enemyTurn);}
function enemyTurn(){const b=G.boss;G.turn++;const key=b.pats[(G.turn-1)%b.pats.length],P=PAT[key];
  G.pat={...P,dur:P.dur||6+(G.lv>=4?0.5:0)};G.pbox={x:240-P.w/2,y:228-P.h/2,w:P.w,h:P.h};
  G.S={t:0,acc:P.sp.map(s=>s[0]*0.85),cnt:P.sp.map(()=>0)};G.bullets=[];
  const B=G.pbox;G.heart.x=B.x+B.w/2;G.heart.y=P.heart==='bottom'||P.heart==='corner'?B.y+B.h-14:B.y+B.h/2;if(P.heart==='corner')G.heart.x=B.x+14;if(P.heart==='diag'){G.heart.x=B.x+B.w/2+26;G.heart.y=B.y+B.h/2+26;}G.heart.inv=0;G.slow=0;
  if(P.init)P.init(B,G.S);G.line=pick(b.says);G.scene='enemy';G.back=null;
  panel([],'','화면을 드래그하거나 방향키(WASD)로 하트를 움직여 피하세요');}
function hurt(b){const h=G.heart;if(b&&b.eff==='slow')G.slow=1.6;h.inv=0.9;G.hp=Math.max(0,G.hp-G.boss.atk);G.hurtF=0.25;SFX.hurt();if(G.hp<=0)gameOver();}
function gameOver(){G.scene='over';G.bullets=[];G.pat=null;SFX.over();G.back=null;
  panel([{label:'다시 도전',on:()=>startLevel(G.lv)},{label:'궁정 지도',on:toTitle}],'','');}
function win(type){const lv=G.lv,b=G.boss;G.pat=null;G.bullets=[];G.result=type;save.res[lv]=type;save.unlocked=Math.max(save.unlocked,Math.min(6,lv+2));store();
  SFX.win();G.bossAT=type==='kill'?0:0.4;
  say(type==='spare'?b.spareEnd:b.killEnd,()=>{if(lv===5)say(finalPages(),endScreen);else endScreen();});}
function finalPages(){const n=save.res.filter(r=>r==='spare').length;
  if(n===6)return['* 궁정의 모두가 성 밖으로 나왔다.','* 피리꾼이 연주하고, 광대가 공을 돌리고, 마녀가 모닥불을 피운다.','* 진홍의 궁정에 처음으로 아침이 왔다.','* [엔딩: 새벽의 궁정]'];
  if(n===0)return['* 텅 빈 궁정. 왕좌에 앉을 사람은 너뿐이다.','* 너는 천천히 왕좌에 앉았다.','* [엔딩: 새로운 진홍의 왕]'];
  return['* 궁정의 일부만이 아침을 맞았다.',`* 용서한 사람: ${n} / 6`,'* [엔딩: 반쯤 열린 문]','* 모두를 용서하면 다른 결말이 기다린다.'];}
function endScreen(){const lv=G.lv;G.scene='done';G.prompt=`* LV${lv+1} 클리어 — ${G.result==='spare'?'용서했다':'쓰러뜨렸다'}`;
  panel(lv<5?[{label:'다음 레벨 ▶',on:()=>startLevel(lv+1)},{label:'궁정 지도',on:toTitle}]:[{label:'궁정 지도',on:toTitle},{label:'처음부터',on:()=>startLevel(0)}],'','');}

/* ---------- 업데이트 ---------- */
function update(dt){G.time+=dt;
  for(let i=G.timers.length-1;i>=0;i--){const tm=G.timers[i];tm.t-=dt;if(tm.t<=0){G.timers.splice(i,1);tm.fn();}}
  const T=G.scene==='enemy'&&G.pbox?G.pbox:DBOX,k=Math.min(1,dt*12);for(const p of['x','y','w','h'])G.box[p]+=(T[p]-G.box[p])*k;
  G.shake=Math.max(0,G.shake-dt);G.slash=Math.max(0,G.slash-dt);G.hurtF=Math.max(0,G.hurtF-dt);
  G.bossA+=(G.bossAT-G.bossA)*Math.min(1,dt*2);
  for(let i=G.pops.length-1;i>=0;i--){G.pops[i].t+=dt;if(G.pops[i].t>1.1)G.pops.splice(i,1);}
  if(G.scene==='text'&&G.msg){const m=G.msg,p=m.pages[m.i];if(p&&m.shown<p.length){const before=Math.floor(m.shown);m.shown=Math.min(p.length,m.shown+dt*38);
    if(Math.floor(m.shown/2)>Math.floor(before/2))SFX.blip();}}
  if(G.scene==='fight'){const F=G.fight;F.x+=F.v*dt;if(F.x>DBOX.x+DBOX.w-12)fightMiss();}
  if(G.scene==='enemy'){const S=G.S,P=G.pat,B=G.pbox,h=G.heart,bx=G.box;S.t+=dt;
    const mx=((held.arrowright||held.d)?1:0)-((held.arrowleft||held.a)?1:0),my=((held.arrowdown||held.s)?1:0)-((held.arrowup||held.w)?1:0);
    G.slow=Math.max(0,(G.slow||0)-dt);const spd=G.slow>0?55:125;let ix=mx+JOY.x,iy=my+JOY.y;const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}h.x+=ix*spd*dt;h.y+=iy*spd*dt;h.x=clamp(h.x,bx.x+8,bx.x+bx.w-8);h.y=clamp(h.y,bx.y+8,bx.y+bx.h-8);h.inv=Math.max(0,h.inv-dt);
    if(S.t>0.35&&S.t<P.dur-0.4)P.sp.forEach((sp,i)=>{S.acc[i]+=dt;while(S.acc[i]>=sp[0]){S.acc[i]-=sp[0];S.cnt[i]++;sp[1](B,S,S.cnt[i]);}});
    if(P.tick&&S.t>0.35)P.tick(B,S,dt);
    for(let i=G.bullets.length-1;i>=0;i--){if(G.scene!=='enemy')break;const b=G.bullets[i];if(!b)continue;b.t+=dt;if(b.warn>0)b.warn-=dt;
      if(b.fn)b.fn(b,dt);else{b.x+=b.vx*dt;b.y+=b.vy*dt;}b.a+=b.va*dt;
      if((b.life&&b.t>b.life)||b.x<B.x-100||b.x>B.x+B.w+100||b.y<B.y-100||b.y>B.y+B.h+100){G.bullets.splice(i,1);continue;}
      if(b.warn>0||h.inv>0||G.scene!=='enemy')continue;
      if(hitTest(b,h))hurt(b);}
    if(G.scene==='enemy'&&S.t>=P.dur)toMenu(true);}}

function hitTest(b,h){if(b.harmless)return false;
  if(b.k==='ring'){const d=Math.hypot(h.x-b.x,h.y-b.y);if(Math.abs(d-b.R)>3.5)return false;let df=Math.atan2(h.y-b.y,h.x-b.x)-b.ga;df=Math.atan2(Math.sin(df),Math.cos(df));return Math.abs(df)>b.gw/2;}
  if(b.k==='puppet'&&!b.cut&&Math.abs(h.x-b.x)<2.5&&h.y>b.top&&h.y<b.y-6)return true;
  if(b.rw)return h.x>b.x-3&&h.x<b.x+b.rw+3&&h.y>b.y-3&&h.y<b.y+b.rh+3;
  return(b.x-h.x)**2+(b.y-h.y)**2<(b.r+3.5)**2;}
/* ---------- 렌더 ---------- */
function drawBullet(b){const warn=b.warn>0,blink=Math.floor(G.time*14)%2;
  if(b.k==='ring'){if(warn)return;c.strokeStyle=b.c;c.lineWidth=3;c.beginPath();c.arc(b.x,b.y,b.R,b.ga+b.gw/2,b.ga-b.gw/2+Math.PI*2);c.stroke();return;}
  if(b.k==='shutter'){if(warn){if(blink){c.strokeStyle='#9aa0ab';c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();
      if(b.vert){c.moveTo(b.x,b.g-b.half);c.lineTo(b.x+300,b.g-b.half);c.moveTo(b.x,b.g+b.half);c.lineTo(b.x+300,b.g+b.half);}
      else{c.moveTo(b.g-b.half,b.y);c.lineTo(b.g-b.half,b.y+200);c.moveTo(b.g+b.half,b.y);c.lineTo(b.g+b.half,b.y+200);}c.stroke();c.setLineDash([]);}return;}
    c.fillStyle='#5c626e';c.fillRect(b.x,b.y,b.rw,b.rh);c.fillStyle='#3a3e47';
    if(b.vert)for(let y=b.y+5;y<b.y+b.rh;y+=6)c.fillRect(b.x,y,b.rw,1.5);else for(let x=b.x+5;x<b.x+b.rw;x+=6)c.fillRect(x,b.y,1.5,b.rh);
    c.fillStyle='#9aa0ab';if(b.vert)c.fillRect(b.x,b.side<0?b.y+b.rh-2:b.y,b.rw,2);else c.fillRect(b.side<0?b.x+b.rw-2:b.x,b.y,2,b.rh);return;}
  if(b.k==='puppet'&&!b.cut){c.strokeStyle=warn?'rgba(243,236,228,.3)':'rgba(243,236,228,.75)';c.lineWidth=1;c.beginPath();c.moveTo(b.x,b.top);c.lineTo(b.x,b.y-6);c.stroke();}
  if(b.rw){if(b.k==='bar'){c.fillStyle='#7c818c';c.fillRect(b.x,b.y,b.rw,b.rh);c.fillStyle='#b9bec8';c.fillRect(b.x,b.y,b.rw,2);
      c.fillStyle='#3a3d44';for(let x=b.x+6;x<b.x+b.rw-3;x+=12)c.fillRect(x,b.y+3.5,2,2);return;}
    if(warn){c.fillStyle=b.k==='pillar'?'rgba(255,122,42,.14)':'rgba(232,226,234,.12)';c.fillRect(b.x,b.y,b.rw,b.rh);
      if(blink){c.strokeStyle=b.k==='pillar'?'#ff7a2a':'#e8e2ea';c.lineWidth=1;c.setLineDash([4,4]);c.strokeRect(b.x+0.5,b.y+0.5,b.rw-1,b.rh-1);c.setLineDash([]);}return;}
    if(b.k==='pillar'){const f=Math.sin(G.time*30)*2;c.fillStyle='#ff5a1f';c.fillRect(b.x-f*0.5,b.y,b.rw+f,b.rh);c.fillStyle='#ffd27a';c.fillRect(b.x+6,b.y,b.rw-12,b.rh);return;}
    c.fillStyle='#e8e2ea';c.fillRect(b.x,b.y,b.rw,b.rh);c.fillStyle='#141016';
    if(b.rw>b.rh)for(let x=b.x;x<b.x+b.rw;x+=14)c.fillRect(x,b.y+b.rh/2-2,7,4);else for(let y=b.y;y<b.y+b.rh;y+=14)c.fillRect(b.x+b.rw/2-2,y,4,7);return;}
  c.save();c.translate(b.x,b.y);if(warn)c.globalAlpha=blink?0.6:0.25;
  switch(b.k){
  case'note':c.rotate(Math.sin(b.t*4)*0.25);noteShape(b.c,1);break;
  case'key':c.rotate(b.a);c.strokeStyle=b.c;c.lineWidth=2;c.beginPath();c.arc(-5,0,3.2,0,Math.PI*2);c.moveTo(-1.8,0);c.lineTo(8,0);c.moveTo(5,0);c.lineTo(5,3);c.moveTo(8,0);c.lineTo(8,3);c.stroke();break;
  case'ball':c.fillStyle=b.c;circ(0,0,b.r);c.fillStyle='rgba(255,255,255,.7)';circ(-2,-2,1.6);break;
  case'card':c.rotate(b.a);c.fillStyle='#f7f1e3';c.fillRect(-4,-6,8,12);c.fillStyle='#c4203a';c.beginPath();c.moveTo(0,-3);c.lineTo(2.5,0);c.lineTo(0,3);c.lineTo(-2.5,0);c.closePath();c.fill();break;
  case'flame':c.rotate(Math.atan2(b.vy,b.vx));c.fillStyle='#ff7a2a';c.beginPath();c.arc(1,0,4.5,-Math.PI/2,Math.PI/2);
    c.quadraticCurveTo(-6,3,-11+Math.sin(b.t*30)*2,0);c.quadraticCurveTo(-6,-3,1,-4.5);c.fill();c.fillStyle='#ffe08a';circ(1,0,2);break;
  case'pawn':c.fillStyle='#f2eef5';circ(0,-4,3);c.beginPath();c.moveTo(-2.5,-1.5);c.lineTo(2.5,-1.5);c.lineTo(4,4);c.lineTo(-4,4);c.closePath();c.fill();c.fillRect(-5,4,10,2.5);break;
  case'puppet':{const sw=Math.sin(b.t*8)*0.5;c.strokeStyle='#d8b98a';c.lineWidth=1.6;c.beginPath();
    c.moveTo(-1,0);c.lineTo(-6,4+sw*3);c.moveTo(1,0);c.lineTo(6,4-sw*3);c.moveTo(-1.5,5);c.lineTo(-3,10+sw*2);c.moveTo(1.5,5);c.lineTo(3,10-sw*2);c.stroke();
    c.fillStyle='#e8b923';c.fillRect(-3,-1,6,7);c.fillStyle='#f6f1e7';circ(0,-4.5,3.2);c.fillStyle='#1a1416';c.fillRect(-1.6,-5.2,1,1);c.fillRect(0.8,-5.2,1,1);break;}
  case'moon':c.fillStyle='#d9d6cf';circ(0,0,b.r);c.fillStyle='#a8a49a';circ(-2.5,-1.5,2);circ(2.5,2.5,1.4);c.strokeStyle='#a0582a';c.lineWidth=1.5;c.beginPath();c.arc(0,0,b.r+1,0,Math.PI*2);c.stroke();break;
  case'shard':c.rotate(b.t*8);c.fillStyle='#ffe9a8';c.beginPath();c.moveTo(0,-5);c.lineTo(4,3);c.lineTo(-4,3);c.closePath();c.fill();break;
  case'link':c.strokeStyle='#b0642e';c.lineWidth=2;c.beginPath();c.arc(0,0,b.r,0,Math.PI*2);c.stroke();break;
  case'sigil':{c.strokeStyle='#ff7a2a';c.lineWidth=1.5;c.beginPath();c.arc(0,0,b.r,0,Math.PI*2);c.stroke();c.rotate(b.t*2);
    c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;c.moveTo(Math.cos(a)*b.r,Math.sin(a)*b.r);c.lineTo(Math.cos(a+2.09)*b.r,Math.sin(a+2.09)*b.r);}c.stroke();
    if(!warn){c.fillStyle='rgba(255,140,42,.75)';circ(0,0,b.r);}break;}
  case'mourner':c.fillStyle='#8a8094';c.beginPath();c.moveTo(0,-7);c.lineTo(6,6);c.lineTo(-6,6);c.closePath();c.fill();c.fillStyle='#3a3242';circ(0,-5,3.4);c.fillStyle='#f1eef4';c.fillRect(-1,-5,2,2);break;
  case'bell':c.rotate(b.sw||0);c.fillStyle='#c9a24a';c.beginPath();c.moveTo(-5,4);c.quadraticCurveTo(-5,-6,0,-6);c.quadraticCurveTo(5,-6,5,4);c.lineTo(7,6);c.lineTo(-7,6);c.closePath();c.fill();
    c.strokeStyle='#0a0608';c.lineWidth=1;c.beginPath();c.moveTo(1,-5);c.lineTo(-1,0);c.lineTo(2,4);c.stroke();break;
  case'orb':c.fillStyle='rgba(212,44,69,.35)';circ(0,0,b.r+2.5);c.fillStyle=b.c;circ(0,0,b.r);c.fillStyle='#ffb3be';circ(-1,-1,1.2);break;}
  c.restore();}
function bubble(text){c.font='12px '+FONT;const lines=wrap(text,112),bw=132,bh=14+lines.length*17,bx=338,by=36;
  c.fillStyle='#f3ece4';rrect(bx,by,bw,bh,6);c.fill();c.beginPath();c.moveTo(bx+1,by+14);c.lineTo(bx-9,by+22);c.lineTo(bx+1,by+26);c.closePath();c.fill();
  c.fillStyle='#120a0d';lines.forEach((l,i)=>c.fillText(l,bx+10,by+20+i*17));}
function boxText(str,shown){c.font='15px '+FONT;c.fillStyle='#f3ece4';const lines=wrap(str,DBOX.w-36);let rem=shown==null?1e9:shown;
  lines.forEach((l,i)=>{if(rem<=0)return;c.fillText(l.slice(0,Math.ceil(rem)),DBOX.x+18,DBOX.y+32+i*24);rem-=l.length+1;});}
function drawTitle(){c.textAlign='center';c.font='36px '+FONT;c.fillStyle='#5c0b18';c.fillText('진홍의 궁정',242,84);c.fillStyle='#e7c35a';c.fillText('진홍의 궁정',240,82);
  c.font='11px '+FONT;c.fillStyle='#8d7a80';c.fillText('〈The Court of the Crimson King〉에서 영감받은 팬 게임',240,106);
  c.strokeStyle='#2a1a20';c.lineWidth=1;c.beginPath();c.moveTo(20,252.5);c.lineTo(460,252.5);c.stroke();
  BOSSES.forEach((b,i)=>{const x=48+i*77,locked=i>=save.unlocked;SIL=locked;b.fig(x,250,0.55,G.time+i*0.7);SIL=false;
    c.font='12px '+FONT;c.fillStyle=locked?'#4a3a40':'#f3ece4';c.fillText('LV'+(i+1),x,274);const r=save.res[i];
    c.font='11px '+FONT;c.fillStyle=r==='spare'?'#e7c35a':r==='kill'?'#c4203a':'#4a3a40';c.fillText(r==='spare'?'용서':r==='kill'?'격파':locked?'잠김':'',x,292);});
  const n=save.res.filter(Boolean).length;c.font='12px '+FONT;c.fillStyle='#8d7a80';c.fillText(`클리어 ${n} / 6`,240,330);c.textAlign='left';}
function draw(){c.fillStyle='#0a0608';c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(240,80,10,240,80,300);g.addColorStop(0,'rgba(140,20,40,0.22)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  if(G.scene==='title'){drawTitle();return;}
  const bs=G.boss,over=G.scene==='over';
  if(bs&&!over){c.save();c.globalAlpha=G.bossA;bs.fig(240+(G.shake>0?Math.sin(G.time*70)*G.shake*8:0),154,1.25,G.time);c.restore();
    if(G.slash>0){const p=1-G.slash/0.4;c.strokeStyle='#ff3b4e';c.lineWidth=4;c.beginPath();for(let i=0;i<3;i++){const sx=205+i*16,sy=40+i*6;c.moveTo(sx,sy);c.lineTo(sx+p*55,sy+p*85);}c.stroke();}
    c.font='11px '+FONT;c.fillStyle=G.spare>=100?'#e7c35a':'#cdbfc5';c.fillText(bs.en,16,20);
    c.fillStyle='#3a2a30';c.fillRect(16,26,96,5);c.fillStyle='#c4203a';c.fillRect(16,26,96*G.bhp/bs.hp,5);
    c.fillStyle='#8d7a80';c.fillText(bs.name,16,46);}
  if(over){c.textAlign='center';c.font='28px '+FONT;c.fillStyle='#c4203a';c.fillText('쓰러졌다',240,70);c.textAlign='left';
    const sp=Math.min(1,G.time%100);heartShape(232,115,1.4,'#e0283e');heartShape(248,115,1.4,'#e0283e');c.fillStyle='#0a0608';c.beginPath();c.moveTo(240,100);c.lineTo(236,110);c.lineTo(243,116);c.lineTo(238,126);c.lineTo(242,126);c.lineTo(247,116);c.lineTo(240,110);c.lineTo(244,100);c.closePath();c.fill();}
  if(G.scene==='enemy'&&G.line)bubble(G.line);
  const B=G.box;c.fillStyle='#000';c.fillRect(B.x,B.y,B.w,B.h);
  c.save();c.beginPath();c.rect(B.x+2,B.y+2,B.w-4,B.h-4);c.clip();
  if(G.scene==='text'&&G.msg){const m=G.msg;if(m.pages[m.i])boxText(m.pages[m.i],m.shown);}
  else if(G.scene==='menu')boxText(G.flavor);
  else if(G.scene==='sub'||G.scene==='done')boxText(G.prompt);
  else if(over)boxText('* 아직 궁정의 문은 열려 있다. 다시 일어설까?');
  else if(G.scene==='fight'||G.scene==='fightdone'){const F=G.fight,fy=DBOX.y,fh=DBOX.h,cxm=DBOX.x+DBOX.w/2,half=DBOX.w/2-14;
    for(let i=-half;i<=half;i+=10){const k=Math.sqrt(Math.max(0,1-(i/half)**2)),hh=(fh-30)*k*0.5+6;
      c.fillStyle=Math.abs(i)<14?'#e7c35a':Math.abs(i/half)<0.5?'#7a2a3a':'#3a1a24';c.fillRect(cxm+i-1.5,fy+fh/2-hh,3,hh*2);}
    if(F){c.fillStyle=F.stopped&&Math.floor(G.time*12)%2?'#e7c35a':'#f3ece4';c.fillRect(F.x-3,fy+8,6,fh-16);c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(F.x-3,fy+8,6,fh-16);}}
  else if(G.scene==='enemy'){G.bullets.forEach(drawBullet);const h=G.heart;if(!(h.inv>0&&Math.floor(h.inv*20)%2))heartShape(h.x,h.y,0.75,G.slow>0?'#c07ad8':'#ff2a44');if(G.slow>0){c.font='10px '+FONT;c.fillStyle='#cfa8ff';c.fillText('z',h.x+7,h.y-6-Math.sin(G.time*4)*2);}}
  c.restore();
  c.strokeStyle='#f3ece4';c.lineWidth=3;c.strokeRect(B.x+1.5,B.y+1.5,B.w-3,B.h-3);
  c.font='13px '+FONT;c.fillStyle='#f3ece4';c.fillText(`LV ${G.lv+1}`,22,318);c.fillText('HP',100,318);
  c.fillStyle='#9c1b2e';c.fillRect(126,307,60,13);c.fillStyle='#f2d03b';c.fillRect(126,307,60*G.hp/G.maxhp,13);
  c.fillStyle='#f3ece4';c.fillText(`${G.hp} / ${G.maxhp}`,196,318);
  c.fillStyle='#8d7a80';c.font='11px '+FONT;c.fillText('아이템 '+G.items.length,300,318);
  c.textAlign='center';G.pops.forEach(p=>{c.globalAlpha=Math.max(0,1-p.t/1.1);c.font='22px '+FONT;c.fillStyle='#000';c.fillText(p.txt,p.x+2,p.y-p.t*26+2);c.fillStyle=p.c;c.fillText(p.txt,p.x,p.y-p.t*26);});
  c.globalAlpha=1;c.textAlign='left';
  if(G.hurtF>0){c.fillStyle=`rgba(255,40,60,${G.hurtF*0.5})`;c.fillRect(0,0,W,H);}}

let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
  try{update(dt);draw();}catch(err){console.error(err);}}
toTitle();requestAnimationFrame(frame);
})();
</script>
