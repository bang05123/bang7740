<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>강철 방파제</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 화면 전체가 폭풍우 치는 밤바다 캔버스, 위엔 계기판 HUD, 아래엔 조종 패드 */
:root{
  --ink:#070b10;
  --panel:rgba(10,16,22,.62);
  --line:rgba(160,180,196,.28);
  --fg:#e4ebf0;
  --dim:#8795a2;
  --amber:#ffb347;
  --hazard:#e1a21f;
  --acid:#a8ff4f;
  --alert:#ff3d5e;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--body)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.side{min-width:0;display:grid;gap:5px}
.tag{display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap;overflow:hidden}
.tag b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em}
.tag span{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;text-overflow:ellipsis;overflow:hidden}
.foe .tag{justify-content:flex-end}
.bar{position:relative;height:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);overflow:hidden;
  clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.foe .bar{clip-path:polygon(0 0,100% 0,100% 100%,7px 100%)}
.bar i,.bar u{position:absolute;inset:0;transform-origin:left center;display:block}
.foe .bar i,.foe .bar u{transform-origin:right center}
.bar u{background:#f4f0e6;opacity:.75}
.me .hp i{background:linear-gradient(180deg,#ffd27f,var(--hazard) 60%,#9c6a0c)}
.foe .hp i{background:linear-gradient(180deg,#d6ff9a,var(--acid) 55%,#4f8a1d)}
.foe.cyan .hp i{background:linear-gradient(180deg,#c9f6ff,#4fd8ff 55%,#14708c)}
.bar.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.55) calc(10% - 2px) 10%)}
.mark{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:var(--fg);opacity:.7;z-index:2}
.sub{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.foe .sub{justify-content:flex-end}
.heat{flex:1;height:6px;clip-path:none}
.heat i{background:linear-gradient(90deg,#4aa3c7,var(--amber) 60%,var(--alert))}
.heat.over{border-color:var(--alert);animation:blink .3s steps(2) infinite}
#kPhase.p2{color:var(--acid);font-weight:600}
.cyan #kPhase.p2{color:#7fe8ff}
.mid{display:grid;justify-items:center;gap:4px;pointer-events:auto}
#clock{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.mini{font:600 10px var(--body);color:var(--dim);background:var(--panel);border:1px solid var(--line);padding:3px 7px;border-radius:2px;cursor:pointer}
.mini:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 조종 패드 */
#controls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.pad{pointer-events:auto;display:grid;gap:9px}
.move{grid-template-columns:repeat(2,66px)}
.act{grid-template-columns:repeat(2,72px);grid-template-rows:58px 72px}
.pad button{position:relative;overflow:hidden;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);
  font-family:var(--display);font-size:18px;display:grid;place-items:center;align-content:center;gap:1px;padding:0;
  border-radius:3px;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .08s,transform .08s}
.move button{height:66px;font-size:22px}
.pad button small{font:500 9px var(--mono);color:var(--dim);letter-spacing:.06em}
.pad button.on{background:rgba(255,179,71,.28);border-color:var(--amber);transform:scale(.95)}
.pad .hv{border-color:rgba(225,162,31,.6)}
.pad .gd{border-color:rgba(110,170,200,.55)}
.pad .sp i{position:absolute;left:0;right:0;bottom:0;height:100%;background:rgba(255,179,71,.22);transform-origin:bottom;transform:scaleY(0)}
.pad .sp span,.pad .sp small{position:relative}
.pad .sp{font-size:15px}
.pad .sp.ready{border-color:var(--amber);animation:pulse 1s ease-in-out infinite}
.pad .sp.ready small{color:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,179,71,.35),inset 0 0 18px rgba(255,179,71,.35)}}
@keyframes blink{50%{opacity:.4}}

/* 알림 배너 */
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0;transform:scale(1.15);transition:opacity .25s,transform .25s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#banner.show{opacity:1;transform:none}
#banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,46px);letter-spacing:.03em;text-shadow:0 3px 0 rgba(0,0,0,.6)}
#banner span{display:inline-block;margin-top:6px;font:600 11px var(--mono);letter-spacing:.14em;background:var(--hazard);color:#140e02;padding:3px 8px}
#banner.bad b{color:var(--alert)}
#banner.acid b{color:var(--acid)}
#banner.cyan b{color:#7fe8ff}

/* 시작 / 결과 화면 */
.overlay{position:absolute;inset:0;display:grid;overflow-y:auto;
  background:radial-gradient(120% 80% at 50% 30%,rgba(7,11,16,.35),rgba(7,11,16,.92));
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
.card{width:min(460px,100%);display:grid;gap:14px;margin:auto}
.eyebrow{font:600 11px var(--mono);letter-spacing:.16em;color:var(--hazard);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 4px,#1a1406 4px 8px)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,70px);line-height:.95;letter-spacing:.01em;text-wrap:balance;
  text-shadow:0 4px 0 #000,0 0 40px rgba(255,179,71,.18)}
h1 small{display:block;font:600 12px var(--mono);letter-spacing:.42em;color:var(--dim);margin-top:10px;text-shadow:none}
.brief{margin:0;font-size:14px;line-height:1.6;color:#c3ced6;max-width:62ch}
.pick{display:grid;gap:6px}
.pick>span{font:600 10px var(--mono);letter-spacing:.16em;color:var(--dim)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts button{display:grid;gap:3px;text-align:left;align-content:start;padding:9px 10px;background:rgba(255,255,255,.035);border:1.5px solid var(--line);color:var(--fg);cursor:pointer;border-radius:2px;font-family:var(--display);font-size:16px;min-width:0}
.opts button small{font:400 11px var(--body);color:var(--dim);line-height:1.35}
.opts button[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,179,71,.14)}
.opts button[aria-pressed="true"] small{color:#e6d3b0}
details.keysbox{border-left:3px solid var(--hazard);background:rgba(255,255,255,.035);padding:10px 14px}
details.keysbox summary{cursor:pointer;font:600 13px var(--body);color:var(--amber)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;line-height:1.45;margin:10px 0 0}
.keys dt{font-family:var(--display);font-size:14px;color:var(--amber);white-space:nowrap}
.keys dd{margin:0;color:#c3ced6}
.tip{font-size:12.5px;color:var(--dim);margin:0;line-height:1.55}
.tip b{color:var(--alert);font-weight:600}
.go{justify-self:start;font-family:var(--display);font-size:22px;color:#140e02;background:var(--amber);border:0;padding:13px 30px 12px;cursor:pointer;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);letter-spacing:.06em}
.go:active{transform:translateY(1px)}
.pc{font:500 11px var(--mono);color:var(--dim);margin:0;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:rgba(8,12,17,.9);padding:10px 12px;display:grid;gap:2px}
.stats span{font-size:11px;color:var(--dim)}
.stats b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
#resTitle.win{color:var(--amber)}
#resTitle.lose{color:var(--alert)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghostbtn{font:600 13px var(--body);color:var(--fg);background:none;border:1.5px solid var(--line);padding:11px 16px;cursor:pointer}
@media (orientation:landscape) and (max-height:500px){
  .act{grid-template-rows:52px 64px;grid-template-columns:repeat(2,66px)}
  .move button{height:60px}
  #banner{top:22%}
}
@media (prefers-reduced-motion:reduce){.pad .sp.ready{animation:none}#banner{transition:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="거대 로봇과 괴수가 싸우는 전장"></canvas>

  <div id="hud">
    <div class="side me">
      <div class="tag"><b id="mName">방벽 3호기</b><span id="mCode">BULWARK MK-III</span></div>
      <div class="bar hp"><u id="pGhost"></u><i id="pHp"></i></div>
      <div class="sub">리액터 열<div class="bar heat" id="heatBar"><i id="pHeat"></i></div></div>
    </div>
    <div class="mid">
      <div id="clock">00:00</div>
      <button class="mini" id="mute" type="button">소리 켬</button>
    </div>
    <div class="side foe" id="foeSide">
      <div class="tag"><span id="kGrade">등급 IV · 해구 개체</span><b id="kName">오닉스</b></div>
      <div class="bar hp"><u id="kGhost"></u><i id="kHp"></i><em class="mark"></em></div>
      <div class="sub"><span id="kPhase">1단계 · 탐색</span></div>
    </div>
  </div>

  <div id="banner"><b id="bnT"></b><span id="bnS"></span></div>

  <div id="controls">
    <div class="pad move">
      <button type="button" data-k="left" aria-label="뒤로 이동">◀</button>
      <button type="button" data-k="right" aria-label="앞으로 이동">▶</button>
    </div>
    <div class="pad act">
      <button type="button" data-k="special" class="sp" id="bSp"><i id="spFill"></i><span id="spName">파일벙커</span><small id="spTxt">동기 0%</small></button>
      <button type="button" data-k="heavy" class="hv"><span id="hvName">강타</span><small>길게 충전</small></button>
      <button type="button" data-k="guard" class="gd"><span>가드</span></button>
      <button type="button" data-k="jab"><span id="jbName">잽</span><small id="jbSub"></small></button>
    </div>
  </div>

  <div class="overlay" id="title">
    <div class="card">
      <div class="eyebrow">항만 방어 사령부 · 긴급 출격</div>
      <h1>강철 방파제<small>IRON BREAKWATER</small></h1>
      <p class="brief">해구에서 괴수가 올라오고 있다. 뒤는 항구다. 기체를 골라 출격하라.</p>
      <div class="pick"><span>기체</span>
        <div class="opts" id="pickM">
          <button type="button" data-v="bulwark" aria-pressed="true">방벽 3호기<small>근접 · 충전 강타와 파일벙커</small></button>
          <button type="button" data-v="thunder" aria-pressed="false">천둥 5호기<small>원거리 · 기관포, 플라즈마, 미사일</small></button>
        </div>
      </div>
      <div class="pick"><span>괴수</span>
        <div class="opts" id="pickK">
          <button type="button" data-v="onyx" aria-pressed="true">오닉스<small>등급 IV · 무겁게 밀어붙인다</small></button>
          <button type="button" data-v="sickle" aria-pressed="false">시클<small>등급 III · 빠르고 뛰어든다</small></button>
        </div>
      </div>
      <div class="pick"><span>난이도</span>
        <div class="opts three" id="pickD">
          <button type="button" data-v="easy" aria-pressed="false">견습<small>괴수가 약하고 느리다</small></button>
          <button type="button" data-v="normal" aria-pressed="true">정규<small>처음이면 여기서</small></button>
          <button type="button" data-v="hard" aria-pressed="false">베테랑<small>봐주지 않는다</small></button>
        </div>

      <details class="keysbox"><summary id="keysSum">조작법 · 방벽 3호기</summary><dl class="keys" id="keys"></dl></details>

      <button class="go" id="start" type="button">출격</button>
      <p class="pc" id="pcKeys">키보드: A/D 이동 · J 잽 · K 강타 · L 가드 · 스페이스 필살기</p>
      <p class="pc" id="bestLine" hidden></p>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card">
      <div class="eyebrow" id="resEye">작전 보고</div>
      <h1 id="resTitle">격퇴 성공</h1>
      <p class="brief" id="resText"></p>
      <div class="stats">
        <div><span>작전 시간</span><b id="sTime">0:00</b></div>
        <div><span>명중</span><b id="sHits">0</b></div>
        <div><span>막아낸 공격</span><b id="sBlock">0</b></div>
        <div><span>받은 피해</span><b id="sTaken">0</b></div>
      </div>
      <div class="btns"><button class="go" id="again" type="button">재출격</button><button class="ghostbtn" id="toTitle" type="button">기체·괴수 바꾸기</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const approach=(v,t,s)=>v<t?Math.min(t,v+s):Math.max(t,v-s);
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ================= 소리 ================= */
const A={ctx:null,master:null,on:true,nb:null,
  init(){
    if(this.ctx){this.ctx.resume&&this.ctx.resume();return;}
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    try{
      const ctx=new C(); this.ctx=ctx;
      const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=5;
      this.master=ctx.createGain(); this.master.gain.value=this.on?.9:0; this.master.connect(comp); comp.connect(ctx.destination);
      const len=ctx.sampleRate*2, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.nb=b;
      const bed=(type,f,q,v)=>{const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ctx.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(this.master);s.start();};
      bed('bandpass',2800,.4,.045); bed('lowpass',260,.6,.07);
    }catch(e){this.ctx=null;}
  },
  setOn(v){this.on=v; if(this.master) this.master.gain.value=v?.9:0;},
  noise(dur,type,freq,q,vol,att=.003,when=0){
    const c=this.ctx; if(!c) return null; const t=c.currentTime+when;
    const s=c.createBufferSource(); s.buffer=this.nb; const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f).connect(g).connect(this.master); s.start(t,Math.random()*1.5); s.stop(t+dur+.05); return f;
  },
  tone(type,f0,f1,dur,vol,when=0){
    const c=this.ctx; if(!c) return; const t=c.currentTime+when;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+.05);
  },
  thud(p=1){this.tone('sine',120,30,.25+.45*p,.95*p); this.noise(.2+.35*p,'lowpass',420,.7,.55*p);},
  step(p=.4){this.tone('sine',70,34,.32,.5*p); this.noise(.25,'lowpass',300,.6,.3*p);},
  clank(p=1){this.tone('square',230,150,.12,.1*p); this.tone('triangle',700,540,.3,.14*p); this.noise(.2,'highpass',2600,.5,.22*p);},
  whoosh(p=1){const f=this.noise(.32,'bandpass',380,1.4,.28*p,.09); if(f) f.frequency.exponentialRampToValueAtTime(1700,this.ctx.currentTime+.3);},
  servo(d=.3,p=1){this.tone('sawtooth',62,150,d,.05*p);},
  hiss(d=1.4){this.noise(d,'highpass',2800,.3,.16,.05);},
  squelch(p=1){this.noise(.25,'bandpass',600,2.5,.4*p,.005); this.tone('sine',300,90,.2,.2*p);},
  thunder(){this.noise(2.6,'lowpass',170,.5,.75,.06,rnd(.3,1.1));},
  shot(){this.tone('square',170,55,.09,.16); this.noise(.14,'bandpass',900,.8,.38,.002); this.tone('sine',90,40,.12,.3);},
  boom(p=1){this.tone('sine',95,26,.35+.5*p,.85*p); this.noise(.4+.5*p,'lowpass',700,.6,.6*p,.005);},
  plasma(c=1){this.tone('sawtooth',520,70,.5,.16+.1*c); this.noise(.6,'bandpass',320,1,.5,.01); this.tone('sine',85,24,.9,.9);},
  zap(){this.noise(.55,'highpass',3000,.5,.38,.005); this.tone('square',95,38,.45,.16); this.tone('sawtooth',1500,180,.35,.07);},
  roar(d=1.6,p=1,pitch=1){
    const c=this.ctx; if(!c) return; const t=c.currentTime;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(280*pitch,t); lp.frequency.linearRampToValueAtTime(950*pitch,t+d*.3); lp.frequency.linearRampToValueAtTime(220*pitch,t+d);
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.45*p,t+.15); g.gain.setValueAtTime(.45*p,t+d*.6); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    lp.connect(g).connect(this.master);

function hitKaiju(o){
  if(K.state==='dead') return;
  let dmg=o.dmg,poise=o.poise;
  if(K.state==='roar'){dmg*=.5;poise=0;}
  K.hp=Math.max(0,K.hp-dmg);K.ghostT=.6;K.flashT=.1;K.vx+=o.kb;K.flinch=Math.max(K.flinch,o.flinch);

  stop(o.stop);shake(o.shake);G.punch=Math.max(G.punch,o.punch);

    case 'heavy': A.thud(.8+.7*c);A.squelch(1.2);buzz(50+60*c);if(c>=.98){G.slowT=.35;banner('풀차지','FULL IMPACT','',.9);}break;

    case 'shell': A.thud(.22);A.clank(.3);break;

    case 'missile': A.boom(.45);boomFx(hx,hy,.9);break;
  }
  G.stats.hits++;
  P.sync=Math.min(100,P.sync+o.sync*D.sync);
  const wind=K.state==='atk'&&K.ph==='w'&&K.atk!=='hop';
  K.poise-=poise;
  if(K.hp<=0){killKaiju();return;}
  if(K.state==='roar') return;
  if(K.state==='atk'&&K.atk==='leap'&&K.ph==='a') return;
  if(o.interrupt&&wind){kStagger(1.0);if(o.fx!=='missile') banner('끊어냈다','COUNTER','',1);}
  else if(K.poise<=0) kStagger(1.1);
  if(!K.phase2&&K.hp<=K.max*.5&&K.state!=='atk') startRoar();
}
function playerUpdate(dt){
  const vent=P.vent>0;
  if(vent){P.vent-=dt;P.heat=Math.max(0,P.heat-42*dt);if(Math.random()<dt*14) steam(P.x+rnd(-30,30),-250,1,10);if(P.vent<=0) banner('냉각 완료','REACTOR NOMINAL','',1);}
  else P.heat=Math.max(0,P.heat-(P.state==='guard'?7:14)*dt);
  P.st+=dt; if(P.flashT>0) P.flashT-=dt; if(P.muzzle>0) P.muzzle-=dt;
  let move=0;
  switch(P.state){
    case 'idle':
      if(input.guard){P.state='guard';A.clank(.4);break;}
      if(!vent&&input.spQ&&P.sync>=100){startAtk('special');break;}
      if(!vent&&input.jabQ){startAtk('jab');break;}
      if(!vent&&input.heavy){P.state='charge';P.charge=0;P.st=0;A.servo(1.2,1.2);A.hiss(.5);break;}
      move=(input.right?1:0)-(input.left?1:0);
      break;
    case 'charge':
      P.charge=Math.min(1,P.charge+dt/1.4);
      if(P.charge>=1&&Math.random()<dt*20) steam(P.x-40,-210,1,8);
      if(input.guard){P.state='guard';P.charge=0;break;}
      if(!input.heavy) startAtk('heavy');
      break;
    case 'guard': if(!input.guard) P.state='idle'; break;
    case 'stagger': P.stag-=dt; if(P.stag<=0) P.state='idle'; break;
    case 'atk':{
      const d=M.atk[P.atk];

function update(dt){

  playerUpdate(dt); kaijuUpdate(dt);
  // 괴수 투사체
  for(let i=G.proj.length-1;i>=0;i--){const p=G.proj[i];p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(Math.random()<.6) part({t:'ichor',x:p.x,y:p.y,vx:rnd(-30,30),vy:rnd(-30,30),life:.4,max:.4,s:rnd(3,6)});
    if(p.x<=P.x+70){kaijuHit(KATK.spit,true);ichor(p.x,p.y,10,-1);G.proj.splice(i,1);} else if(p.y>0){splash(p.x,8,.6);G.proj.splice(i,1);}}

  for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];
    if(s.k==='missile'){

  const bg=cx.createLinearGradient(0,-210,0,-110);bg.addColorStop(0,fl?'#f5fbff':'#2b3a47');bg.addColorStop(1,sh);cx.fillStyle=bg;cx.fill();cx.strokeStyle=edge;cx.lineWidth=3;cx.stroke();
  lighter(()=>{cx.strokeStyle=gl.replace('A',.7*pulse);cx.lineWidth=2.5;cx.beginPath();cx.moveTo(-80,-168+drop);cx.quadraticCurveTo(0,-206+drop,84,-176+drop);cx.stroke();});
  leg(-48,-136+drop,-128,3.1,sh,-26);leg(62,-146+drop,172,4.7,sh,36);
  cx.save();cx.translate(30,-180+drop);cx.rotate(p.lean-K.flinch);
  sArm(54,-60,p.b1,p.b2,sh2,edge,bladeB,gl,false);
  poly([-40,10,10,-30,62,-92,96,-98,84,-58,40,12],sh,edge,2.5);
  for(let i=0;i<4;i++){const x=6+i*20,y=-30-i*18;poly([x-6,y,x-20,y-30,x+8,y-6],'#0b1117',edge,1.5);lighter(()=>glowDot(x-18,y-28,10,gl,.5*pulse));}
  cx.save();cx.translate(96,-96);cx.rotate(p.head);
  const jaw=p.jaw;
  cx.save();cx.translate(56,6);cx.rotate(jaw*.7);poly([0,-2,40,6,8,10],'#0b1117',edge,1.5);cx.restore();
  cx.save();cx.translate(56,-2);cx.rotate(-jaw*.4);poly([0,0,42,-6,8,-8],'#0b1117',edge,1.5);cx.restore();
  poly([-12,4,30,-24,70,-12,74,6,40,16,-6,16],sh,edge,2.5);
  poly([0,-6,-34,-42,22,-20],'#0b1117',edge,1.5);
  const ey=K.state==='atk'&&K.ph==='w'?1:.75;
  if(K.atk==='zap'&&K.state==='atk') lighter(()=>glowDot(40,-6,90,gl,.5));
  lighter(()=>{[[44,-10],[56,-8],[50,0],[62,-1]].forEach(([x,y])=>{circ(x,y,3.5,gl.replace('A',ey));glowDot(x,y,14,gl,.45*ey);});});
  cx.restore();
  sArm(70,-72,p.a1,p.a2,sh,edge,blade,gl,true);
  cx.restore();
  cx.restore();
}

/* ================= 배경과 바다 ================= */
function drawSky(z){
  const fl=G.flash;
  const g=cx.createLinearGradient(0,0,0,waterY);
  g.addColorStop(0,fl>0?`rgb(${20+80*fl},${28+90*fl},${44+100*fl})`:'#0a111c');g.addColorStop(1,fl>0?`rgb(${36+60*fl},${48+70*fl},${62+70*fl})`:'#1d2833');
  cx.fillStyle=g;cx.fillRect(0,0,W,waterY+2);
  for(const c of CLOUDS){c.x=(c.x+c.s*.016)%1.4;const x=(c.x-.2)*W*1.4-G.cam.x*z*.05%W,y=c.y*waterY,r=c.r*Math.max(W,500);
    cx.fillStyle=fl>0?`rgba(${70+120*fl},${84+120*fl},${100+120*fl},.35)`:'rgba(34,45,58,.4)';cx.beginPath();cx.ellipse(x,y,r,r*.32,0,0,TAU);cx.fill();}
  if(G.bolt&&fl>.25){cx.strokeStyle=`rgba(225,235,255,${fl})`;cx.lineWidth=2;cx.beginPath();G.bolt.forEach(([x,y],i)=>{const X=x*W,Y=y*waterY;i?cx.lineTo(X,Y):cx.moveTo(X,Y);});cx.stroke();}
  const s=z*.38,par=.28;
  for(const b of CITY){const X=(b.x-G.cam.x*par)*s+W/2;if(X+b.w*s<0||X>W) continue;const Hh=b.h*s;
    cx.fillStyle=fl>0?`rgb(${22+50*fl},${30+56*fl},${42+60*fl})`:'#111a24';cx.fillRect(X,waterY-Hh,b.w*s+.5,Hh);
    for(const wd of b.win){const on=Math.sin(G.t*.3+wd[2]*40)>-.9;if(!on) continue;cx.fillStyle=wd[2]>.85?'rgba(180,220,255,.5)':'rgba(255,196,110,.42)';cx.fillRect(X+wd[0]*s,waterY-Hh+wd[1]*s,Math.max(1,1.6*s),Math.max(1,1.6*s));}
    if(b.h>175&&Math.sin(G.t*3+b.x)>.4){cx.fillStyle='rgba(255,60,60,.85)';cx.fillRect(X+b.w*s/2-1,waterY-Hh-3,2.5,2.5);}}
}
function drawWall(){
  poly([-600,-160,96,-160,118,40,-600,40],'#2b3238','#12171b',3);
  cx.fillStyle='#363e45';cx.fillRect(-600,-172,700,14);
  cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=2;cx.beginPath();for(let x=-560;x<100;x+=70){cx.moveTo(x,-158);cx.lineTo(x+4,40);}cx.stroke();
  for(let i=0;i<10;i++){cx.fillStyle=i%2?'#d99a1e':'#15140f';cx.beginPath();cx.moveTo(40+i*7,-158);cx.lineTo(47+i*7,-158);cx.lineTo(56+i*7-14,-110);cx.lineTo(49+i*7-14,-110);cx.fill();}
  const on=Math.sin(G.t*4)>0;cx.fillStyle=on?'#ffb347':'#5a3f18';cx.fillRect(70,-186,10,10);
  if(on) lighter(()=>glowDot(75,-181,40,'rgba(255,170,60,A)',.5));
}
function waveY(x){return Math.sin(x*.011+G.t*1.3)*4+Math.sin(x*.027-G.t*2.1)*2.4;}
function drawWater(l,r,bot){
  cx.beginPath();cx.moveTo(l,bot);for(let x=l;x<=r;x+=18) cx.lineTo(x,waveY(x));cx.lineTo(r,bot);cx.closePath();
  const g=cx.createLinearGradient(0,0,0,bot);g.addColorStop(0,'rgba(22,44,56,.86)');g.addColorStop(.25,'rgba(10,22,30,.95)');g.addColorStop(1,'rgba(4,9,13,1)');cx.fillStyle=g;cx.fill();
  cx.strokeStyle=G.flash>0?`rgba(220,235,245,${.3+.5*G.flash})`:'rgba(140,180,196,.32)';cx.lineWidth=2;cx.beginPath();for(let x=l;x<=r;x+=18){const y=waveY(x);x===l?cx.moveTo(x,y):cx.lineTo(x,y);}cx.stroke();
  const refl=(x,col,a)=>{for(let i=0;i<7;i++){const y=10+i*14,wv=Math.sin(G.t*3+i*1.7)*10;cx.fillStyle=col.replace('A',a*(1-i/8));cx.fillRect(x-30+wv-i*2,y,60+i*4,3);}};
  lighter(()=>{
    if(P.state!=='ko') refl(P.x+30,M.pal.eyeGlow,.22);
    if(K.state!=='dead'&&K.y>-40) refl(K.x-60,kGlow(),.2);
    refl(75,'rgba(255,170,60,A)',Math.sin(G.t*4)>0?.18:0);
  });
  const foam=(x,wd)=>{cx.fillStyle='rgba(210,228,236,.28)';cx.beginPath();cx.ellipse(x,2+Math.sin(G.t*4+x)*1.5,wd+Math.sin(G.t*5+x)*4,5,0,0,TAU);cx.fill();};
  if(P.state!=='ko'){foam(P.x-20,28);foam(P.x+26,30);}
  if(K.state!=='dead'){if(K.y>-20) KJ.foam.forEach(o=>foam(K.x+o,34));}
  else foam(K.x,90);
}
function drawZone(){
  if(K.state!=='atk'||K.atk!=='leap'||K.ph==='r') return;
  const a=.45+.3*Math.sin(G.t*14);
  cx.fillStyle=`rgba(255,50,80,${a*.35})`;cx.beginPath();cx.ellipse(K.zone,6,82,14,0,0,TAU);cx.fill();
  cx.strokeStyle=`rgba(255,80,100,${a})`;cx.lineWidth=3;cx.setLineDash([14,10]);cx.stroke();cx.setLineDash([]);
}
function drawParts(){
  for(const p of G.parts){const a=Math.max(0,p.life/p.max);
    if(p.t==='spark') lighter(()=>{cx.strokeStyle=`rgba(255,${180+Math.round(60*a)},90,${a})`;cx.lineWidth=p.s;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);cx.stroke();});
    else if(p.t==='ichor') circ(p.x,p.y,p.s*(.5+.5*a),kGlow().replace('A',.85*a));
    else if(p.t==='drop') circ(p.x,p.y,p.s,`rgba(200,220,230,${.6*a})`);
    else if(p.t==='steam') circ(p.x,p.y,p.s,`rgba(200,210,218,${.18*a})`);
    else if(p.t==='smoke') circ(p.x,p.y,p.s,`rgba(70,74,80,${.35*a})`);
    else if(p.t==='boom') lighter(()=>{const r=p.s*(1.4-a*.6);glowDot(p.x,p.y,r*1.6,'rgba(255,160,70,A)',.9*a);circ(p.x,p.y,r*.45*a,`rgba(255,240,200,${a})`);});
    else if(p.t==='ring') lighter(()=>{cx.strokeStyle=kGlow().replace('A',a);cx.lineWidth=5*a+1;cx.beginPath();cx.ellipse(p.x,p.y,p.s*(1-a)+20,(p.s*(1-a)+20)*(p.y>-10?.18:1),0,0,TAU);cx.stroke();});
  }
  for(const p of G.proj){lighter(()=>glowDot(p.x,p.y,34,kGlow(),.6));circ(p.x,p.y,9,kGlow().replace('A',1));}
  for(const s of G.shots){
    if(s.k==='shell') lighter(()=>{cx.strokeStyle='rgba(255,220,140,.95)';cx.lineWidth=4;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-60,s.y);cx.stroke();glowDot(s.x,s.y,14,'rgba(255,200,110,A)',.7);});
    else if(s.k==='plasma') lighter(()=>{glowDot(s.x,s.y,s.r*4,'rgba(110,225,255,A)',.6);circ(s.x,s.y,s.r,'rgba(225,250,255,1)');cx.strokeStyle='rgba(120,230,255,.6)';cx.lineWidth=s.r*1.2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.r*6,s.y);cx.stroke();});
    else {cx.save();cx.translate(s.x,s.y);cx.rotate(s.a);poly([-14,-4,10,-4,16,0,10,4,-14,4],'#c9cfd4','#12171b',1.5);cx.restore();
      lighter(()=>glowDot(s.x-Math.cos(s.a)*16,s.y-Math.sin(s.a)*16,16,'rgba(255,170,80,A)',.8));}
  }
}
function drawRain(dt){
  cx.strokeStyle=G.flash>0?`rgba(220,230,240,${.35+.3*G.flash})`:'rgba(160,184,204,.32)';cx.lineWidth=1;cx.beginPath();
  for(const r of RAIN){r.y+=r.s*dt;r.x-=r.s*.18*dt;if(r.y>H){r.y=rnd(-60,-10);r.x=rnd(-20,W+80);}cx.moveTo(r.x,r.y);cx.lineTo(r.x+r.l*.18,r.y-r.l);}
  cx.stroke();
}
function drawTelegraph(z){
  if(K.state!=='atk'||K.ph!=='w') return;
  const d=KATK[K.atk]; if(!d.label) return;
  const w=d.w*(K.phase2?.78:1)*D.wind,prog=clamp(K.st/w,0,1);
  const sx=(K.x+KJ.tele[0]-G.cam.x)*z+W/2+G.sx,sy=(KJ.tele[1]+K.y)*z+waterY+G.sy;
  const col=d.tcol||(d.block?'255,179,71':'230,70,255');
  cx.strokeStyle=`rgba(${col},.9)`;cx.lineWidth=3;cx.beginPath();cx.arc(sx,sy,22,-Math.PI/2,-Math.PI/2+TAU*prog);cx.stroke();
  cx.strokeStyle=`rgba(${col},.25)`;cx.beginPath();cx.arc(sx,sy,22,0,TAU);cx.stroke();
  cx.fillStyle=`rgba(${col},1)`;cx.font='700 22px "Black Han Sans",sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('!',sx,sy+1);
  cx.font='600 12px "IBM Plex Sans KR",sans-serif';cx.fillText(d.label,sx,sy-36);cx.textAlign='left';cx.textBaseline='alphabetic';
}
function render(rdt){
  cx.setTransform(DPR,0,0,DPR,0,0);
  const dist=Math.max(KJ.minD,K.x-P.x),midx=(P.x+K.x)/2;
  const zw=W/(dist+560),zh=(waterY-hudH)/(380-Math.min(0,K.y)*.6);
  const tz=clamp(Math.min(zw,zh),.25,1.6);
  G.cam.x+=(midx-G.cam.x)*Math.min(1,rdt*3);G.cam.z+=(tz-G.cam.z)*Math.min(1,rdt*2.5);
  G.punch*=Math.pow(.02,rdt);
  const z=G.cam.z*(1+G.punch);
  G.shake*=Math.pow(.004,rdt);G.sx=(Math.random()*2-1)*G.shake;G.sy=(Math.random()*2-1)*G.shake*.7;
  drawSky(z);
  cx.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-G.cam.x*z+G.sx),DPR*(waterY+G.sy));
  drawWall();
  (KJ.id==='onyx'?drawOnyx:drawSickle)();drawRobot();
  const l=G.cam.x-W/2/z-40,r=G.cam.x+W/2/z+40,bot=(H-waterY)/z+60;
  drawWater(l,r,bot);
  drawZone();
  drawParts();
  cx.setTransform(DPR,0,0,DPR,0,0);
  drawTelegraph(z);
  drawRain(rdt);
  if(G.redFlash>0){cx.fillStyle=`rgba(255,40,60,${G.redFlash*.35})`;cx.fillRect(0,0,W,H);G.redFlash=Math.max(0,G.redFlash-rdt*1.5);}
  if(G.flash>0){cx.fillStyle=`rgba(210,225,255,${G.flash*.18})`;cx.fillRect(0,0,W,H);}
  const vg=cx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.45,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
}

/* ================= HUD ================= */
const hud={pHp:$('pHp'),pG:$('pGhost'),heat:$('pHeat'),heatBar:$('heatBar'),kHp:$('kHp'),kG:$('kGhost'),clock:$('clock'),spF:$('spFill'),spT:$('spTxt'),bSp:$('bSp')};
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function updHud(rdt){
  P.ghostT-=rdt;K.ghostT-=rdt;
  if(P.ghostT<=0) P.ghost=approach(P.ghost,P.hp,40*rdt); if(P.ghost<P.hp) P.ghost=P.hp;
  if(K.ghostT<=0) K.ghost=approach(K.ghost,K.hp,140*rdt); if(K.ghost<K.hp) K.ghost=K.hp;
  hud.pHp.style.transform=`scaleX(${P.hp/M.hp})`;hud.pG.style.transform=`scaleX(${P.ghost/M.hp})`;
  hud.kHp.style.transform=`scaleX(${K.hp/K.max})`;hud.kG.style.transform=`scaleX(${K.ghost/K.max})`;
  hud.heat.style.transform=`scaleX(${P.heat/100})`;hud.heatBar.classList.toggle('over',P.vent>0);
  hud.clock.textContent=fmt(G.time);
  const s=Math.floor(P.sync);hud.spF.style.transform=`scaleY(${P.sync/100})`;hud.spT.textContent=s>=100?'준비 완료':'동기 '+s+'%';hud.bSp.classList.toggle('ready',s>=100);
  if(bnTimer>0){bnTimer-=rdt;if(bnTimer<=0) $('banner').className='';}
}
function applyLoadout(){
  $('mName').textContent=M.name;$('mCode').textContent=M.code;
  $('kName').textContent=KJ.name;$('kGrade').textContent=KJ.grade;$('foeSide').classList.toggle('cyan',!!KJ.cyan);
  $('jbName').textContent=M.btn.jab;$('jbSub').textContent=M.btn.jabSub;$('jbSub').hidden=!M.btn.jabSub;
  $('hvName').textContent=M.btn.heavy;$('spName').textContent=M.btn.sp;
  $('keysSum').textContent='조작법 · '+M.name;
  const dl=$('keys');dl.textContent='';M.keys.forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd);});
  $('tip').innerHTML=KJ.tip;$('pcKeys').textContent=M.pcKeys;
  $('kPhase').textContent='1단계 · 탐색';$('kPhase').className='';
  const el=$('bestLine');el.hidden=true;const b=parseFloat(store.get(bestKey()));if(b){el.hidden=false;el.textContent=`${M.name} 대 ${KJ.name} · ${D.name} 최단 기록 ${fmt(b)}`;}
  if(matchMedia('(pointer:coarse)').matches) $('pcKeys').hidden=true;
}

/* ================= 루프 ================= */
let last=0,running=false,started=false;
function frame(ts){
  if(!running) return;
  let rdt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(G.slowT>0){G.slowT-=rdt;G.ts=.28;} else G.ts+=(1-G.ts)*Math.min(1,rdt*6);
  if(G.hitstop>0) G.hitstop-=rdt; else if(started){const dt=rdt*G.ts;const n=Math.ceil(dt/.017);for(let i=0;i<n;i++) update(dt/n);}
  else {G.t+=rdt;(KJ.id==='onyx'?onyxPose:sicklePose)(rdt);}
  render(rdt);updHud(rdt);
  if(G.over){G.endT-=rdt;if(G.endT<=0&&$('result').hidden) showResult();}
  requestAnimationFrame(frame);
}
function showResult(){
  const win=G.result==='win',t=G.time;
  $('resTitle').textContent=win?'격퇴 성공':'방벽 붕괴';$('resTitle').className=win?'win':'lose';
  $('resEye').textContent=`${win?'작전 보고 · 목표 침묵':'작전 보고 · 신호 두절'} · ${M.name} · ${D.name}`;
  const best=parseFloat(store.get(bestKey()))||null;
  let txt;
  if(win){if(!best||t<best){store.set(bestKey(),String(t));txt=best?`최단 기록 경신. 이전 기록은 ${fmt(best)}.`:`${KJ.name} 첫 격퇴 기록. 다음엔 더 빨리.`;}
    else txt=`최단 기록은 ${fmt(best)}. 항구는 지켰다.`;}
  else txt=`${KJ.name}의 남은 체력 ${Math.ceil(K.hp/K.max*100)}%. ${KJ.hint}`;
  $('resText').textContent=txt;
  $('sTime').textContent=fmt(t).replace(/^0/,'');$('sHits').textContent=G.stats.hits;$('sBlock').textContent=G.stats.blocked;$('sTaken').textContent=Math.round(G.stats.taken);
  $('result').hidden=false;$('controls').style.visibility='hidden';
}
function begin(){
  A.init();applyLoadout();newGame();started=true;
  $('title').hidden=true;$('result').hidden=true;$('controls').style.visibility='visible';
  for(const k in input) input[k]=false;
  setTimeout(()=>{if(G&&started){A.roar(1.4,.8,KJ.pitch);banner(KJ.name+' 접근',KJ.code+' CONTACT',KJ.cyan?'cyan':'acid',1.4);}},250);
}
function bindPick(id,table,key,set){
  const btns=document.querySelectorAll('#'+id+' [data-v]');
  const sync=v=>btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  btns.forEach(b=>b.addEventListener('click',()=>{set(table[b.dataset.v]);store.set(key,b.dataset.v);sync(b.dataset.v);applyLoadout();newGame();}));
  return sync;
}
bindPick('pickM',MECHS,'ironbreakwater.mech',v=>M=v)(M.id);
bindPick('pickK',KAIJUS,'ironbreakwater.kaiju',v=>KJ=v)(KJ.id);
bindPick('pickD',DIFFS,'ironbreakwater.diff',v=>D=v)(D.id);
$('start').addEventListener('click',begin);
$('again').addEventListener('click',begin);
$('toTitle').addEventListener('click',()=>{$('result').hidden=true;$('title').hidden=false;started=false;applyLoadout();newGame();});
$('mute').addEventListener('click',()=>{A.setOn(!A.on);$('mute').textContent=A.on?'소리 켬':'소리 끔';});

/* ================= 입력 ================= */
function press(k,on){
  if(k==='jab'){if(on) input.jabQ=true;}
  else if(k==='special'){if(on) input.spQ=true;}
  else input[k]=on;
}
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');press(k,true);};
  const up=()=>{b.classList.remove('on');press(k,false);};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KEYS={a:'left',arrowleft:'left',d:'right',arrowright:'right',j:'jab',z:'jab',k:'heavy',x:'heavy',l:'guard',c:'guard',' ':'special',v:'special'};
window.addEventListener('keydown',e=>{const k=KEYS[e.key.toLowerCase()];if(!k||!started) return;e.preventDefault();if(e.repeat&&(k==='jab'||k==='special')) return;press(k,true);});
window.addEventListener('keyup',e=>{const k=KEYS[e.key.toLowerCase()];if(!k) return;press(k,false);});
window.addEventListener('blur',()=>{for(const k in input) input[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;}else if(!running){running=true;last=performance.now();requestAnimationFrame(frame);}});

applyLoadout();newGame();resize();running=true;last=performance.now();requestAnimationFrame(frame);
window.__dbg={get P(){return P;},get K(){return K;},get G(){return G;},set sync(v){P.sync=v;}};
})();
</script>
