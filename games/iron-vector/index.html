    + '<div class="panel"><div class="mapwrap">' + mapHTML(b) + '</div><div class="legendmap"><span>■ 금색 = 이동 가능</span><span>▨ 빗금 = 잔해(엄폐, 비용 ' + C.RUBBLE_COST + ')</span><span>▷ 화살표 = 기체 방향</span><span style="color:var(--foe)">⬡ 점선 고리 = 사격 가능한 적</span>' + (two ? '<span>◎ 실선 고리 = 사격 대상 · ✓ = 행동 완료</span>' : '') + '</div></div>'
    + '<div class="panel"><div class="actbar"><div class="hint">' + hint + '</div><div class="row">' + btns + '<button class="btn sm" id="fxskip" data-act="fxskip"' + (S.fxBusy && FX.isEnabled() ? '' : ' hidden') + '>연출 건너뛰기</button>' + abort + '</div></div></div>'
    + planHTML(b)
    + '<div class="panel"><div class="ph"><span>판정 결과</span><span class="ser">2D6 · 표시값 = 계산값</span></div><div class="dice">' + volleyHTML(S.volley) + '</div></div></div>';
  const logHtml = b.log.slice(-300).map(l => '<p class="' + l.cls + ' team-' + l.team + '">' + esc(l.text) + '</p>').join('');
  $('#v-battle').innerHTML = '<div class="battle">'
    + '<div class="a-pl">' + sheetHTML(b, pl, true, true, S.hitFlash[pl.id]) + '</div>' + mid
    + '<div class="a-en">' + sheetHTML(b, shown, shown.team === 'player', false, S.hitFlash[shown.id], shown === en ? aimOpt : undefined) + '</div>'
    + '<div class="a-log panel"><div class="ph"><span>전투 로그</span><span class="ser">LOG</span></div><div class="log" id="logbox">' + logHtml + '</div></div></div>';
  const lg = $('#logbox'); if (lg) lg.scrollTop = lg.scrollHeight;
}

/* 사격 한 번(일제 사격)의 연출: 판정은 이미 끝났고, 여기서는 화면만 사격 전 → 연출 → 결과 순서로 보여 준다 */
async function playVolley(b, atk, tgt, shots, pre, extra) {
  const animate = FX.isEnabled() && shots.some(s => s.fired);
  const wasBusy = S.busy;
  if (animate) {
    const pa = pre.mechs.find(x => x.id === atk.id); if (pa) pa.facing = atk.facing; // 공격 방향은 사격 시작과 함께 정해진다
    S.pre = pre; S.busy = true; setFxBusy(true); FX.reset(); render();
    await new Promise(r => setTimeout(r, 30)); // 호출한 쪽(디스패처)이 곧바로 다시 그리는 것을 기다린 뒤 효과 시작 (안 그러면 첫 효과가 사라진 화면에 그려짐)
    if (S.battle !== b) return;
    await FX.volley(atk, tgt, shots);
  }
  if (S.battle !== b) return;
  S.pre = null;
  S.volley = Object.assign({ team: atk.team, attacker: IV.ident(atk), targetLabel: b.mode === '2v2' ? IV.ident(tgt) : null, shots }, extra || {});
  flashFrom(shots, tgt);
  if (animate) { render(); await FX.aftermath(tgt, shots); }
  FX.reset(); setFxBusy(false);
  if (S.battle !== b) return;
  S.busy = wasBusy; render();
}

/* ---------- 결과 화면 ---------- */
function renderResult() {
  const b = S.battle;
  if (!b || !b.over) { $('#v-result').innerHTML = '<div class="panel"><div class="pb">아직 끝난 전투가 없습니다.</div></div>'; return; }
  const win = b.winner === 'player', draw = b.winner === 'draw';
  const two = b.mode === '2v2';
  const loser = win ? b.enemy : b.player;
  const cause = draw ? '라운드 제한(' + C.MAX_ROUNDS + ')에 도달' : two ? (win ? '적 팀 전멸' : '아군 팀 전멸') : loser.parts.HD.destroyed ? '머리 파괴' : '중앙 몸통 파괴';
  const sp = b.stats.player, se = b.stats.enemy;
  const rate = s => s.shots ? Math.round(s.hits / s.shots * 100) + '%' : '-';
  const row = (k, a, e) => '<tr><td>' + k + '</td><td class="n">' + a + '</td><td class="n">' + e + '</td></tr>';
  const lost = arr => arr.length ? esc(arr.join(', ')) : '없음';
  $('#v-result').innerHTML = '<div class="result">'
    + '<div class="verdict ' + (draw ? 'draw' : win ? 'win' : 'lose') + '"><h2>' + (draw ? '무승부' : win ? '승리' : '패배') + '</h2><p>' + b.round + '라운드 · ' + esc(cause) + '</p></div>'
    + '<div class="panel"><div class="ph"><span>전투 통계</span><span class="ser">RESULT</span></div><div class="pb scroll-x"><table class="t"><thead><tr><th></th><th>' + (two ? '아군 팀' : '아군 ' + esc(b.player.name)) + '</th><th>' + (two ? '적 팀' : '적 ' + esc(b.enemy.name)) + '</th></tr></thead><tbody>'
    + row('발사 횟수', sp.shots, se.shots) + row('명중', sp.hits + ' (' + rate(sp) + ')', se.hits + ' (' + rate(se) + ')') + row('가한 피해', sp.damage, se.damage)
    + row('파괴한 부위', lost(sp.partsLost), lost(se.partsLost)) + row('남은 열', two ? b.mechs.filter(m => m.team === 'player').map(m => esc(m.tag) + ' ' + m.heat).join(' · ') : b.player.heat, two ? b.mechs.filter(m => m.team === 'enemy').map(m => esc(m.tag) + ' ' + m.heat).join(' · ') : b.enemy.heat)
    + (two ? row('생존 기체', b.mechs.filter(m => m.team === 'player').map(m => esc(m.tag) + (m.alive ? ' 가동' : ' 격파')).join(' · '), b.mechs.filter(m => m.team === 'enemy').map(m => esc(m.tag) + (m.alive ? ' 가동' : ' 격파')).join(' · ')) : '') + '</tbody></table></div></div>'
    + '<div class="two">' + (two ? b.mechs.map(m => sheetHTML(b, m, m.team === 'player', false)).join('') : sheetHTML(b, b.player, true, false) + sheetHTML(b, b.enemy, false, false)) + '</div>'
    + '<div class="gobar"><button class="btn" data-act="goHangar">설계 수정</button><span class="row"><button class="btn" data-act="toBrief">' + (two ? '편성 바꾸기' : '적 기체 바꾸기') + '</button><button class="btn primary" data-act="start">같은 설정으로 재전투 ▶</button></span></div></div>';
}

/* ---------- 전투 진행 ---------- */
function flashFrom(shots, tgt) {
  const f = {};
  shots.forEach(s => { if (s.fired && s.hit) f[s.loc] = true; });
  S.hitFlash = {};
  S.hitFlash[tgt.id] = f; // 기체별로 따로 표시
}
function scheduleResult(b) {
  setTimeout(() => { if (S.battle === b && S.view === 'battle' && b.over) { S.view = 'result'; render(); } }, 3200);
}
function startBattle() {
  const v = IV.validateDesign(S.design);
  if (!v.ok) return toast('유효하지 않은 설계입니다: ' + v.errors[0]);
  const two = S.mode === '2v2';
  S.battle = IV.createBattle(S.design, IV.PRESETS[S.enemyKey], two ? { mode: '2v2', allyDesign: IV.PRESETS[S.allyKey], enemy2Design: IV.PRESETS[S.enemy2Key] } : undefined);
  S.target = null; S.inspect = null; S.actor = null;
  FX.clear(); S.pre = null; S.fireMode = 'normal'; S.aimPart = null; S.fxBusy = false;
  S.picks = new Set(); S.volley = null; S.busy = false; S.confirmAbort = false; S.hitFlash = {};
  S.view = 'battle';
  const tt = $('#toast'); if (tt) tt.hidden = true;
  render();
}
// AI 기체 한 대의 한 턴을 화면에 보여 주며 진행한다 (판정은 rules.js 가 하고, 여기서는 순서와 연출만 맡는다)
async function runAIUnit(b, m) {
  const two = b.mode === '2v2';
  S.actor = m.id; S.busy = true; render();
  await sleep(two ? 500 : 750); if (S.battle !== b) return false;
  const mv = IV.aiChooseMove(b, m);
  if (mv && !mv.stay) IV.moveMech(b, m, mv); else IV.skipMove(b, m);
  render();
  await sleep(two ? 550 : 850); if (S.battle !== b) return false;
  const pick = IV.aiPickAttack(b, m);
  if (pick) {
    if (two && pick.foe.id !== 'player') S.inspect = pick.foe.id; // 맞는 기체의 기록지를 보여 준다
    const pre = snapshot(b);
    const r = IV.attack(b, m, pick.uids, { target: pick.foe }); // AI도 같은 규칙, 기본은 일반 사격(무작위 피격 부위)
    await playVolley(b, m, pick.foe, r.shots, pre);
  } else {
    m.hasAttacked = true;
    IV.log(b, m.team, 'sys', IV.ident(m) + ': 사격 가능한 무기가 없거나 사거리 밖');
    render();
  }
  if (S.battle !== b) return false;
  IV.endUnit(b, m);
  await sleep(FX.isEnabled() ? (two ? 300 : 450) : (two ? 500 : 1000)); if (S.battle !== b) return false;
  return true;
}
// 지금 턴인 팀의 AI 기체들을 차례로 움직이고, 팀이 모두 끝나면 다음 팀으로 넘어간다. 사람이 조종할 차례가 오면 멈춘다.
async function runAiPhases(b) {
  S.busy = true; render();
  let guard = 0;
  while (!b.over && guard++ < 200) {
    const turnAtStart = b.turn;
    for (const m of IV.teamUnits(b, b.turn)) {
      if (b.over) break;
      if (m.control === 'ai' && m.alive && !m.done) { if (!(await runAIUnit(b, m))) return; }
    }
    if (S.battle !== b) return;
    if (b.over) break;
    IV.endTurn(b);
    if (b.turn === turnAtStart) break; // 사람이 아직 행동 중이면 넘어가지 않는다
    if (b.turn === 'player' && b.player.alive) break;
    render();
  }
  if (S.battle !== b) return;
  S.actor = null; S.inspect = null; S.busy = false; render();
  if (b.over) scheduleResult(b);
}
const ACTS = {
  nav(el) { S.view = el.dataset.view; },
  goBrief() { S.view = 'brief'; },
  goHangar() { S.view = 'hangar'; },
  toBrief() { S.view = 'brief'; },
  enemy(el) { S.enemyKey = el.dataset.key; },
  ally(el) { S.allyKey = el.dataset.key; },
  enemy2(el) { S.enemy2Key = el.dataset.key; },
  mode(el) { S.mode = el.dataset.mode === '2v2' ? '2v2' : '1v1'; },
  selectUnit(el) { // 2대2: 적을 누르면 사격 대상, 아군 AI를 누르면 그 기체의 기록지를 본다
    const b = S.battle; if (!b || b.mode !== '2v2') return;
    const m = b.mechs.find(x => x.id === el.dataset.id); if (!m) return;
    if (m.team === 'enemy') { S.target = m.id; S.inspect = null; } else S.inspect = m.id === 'player' ? null : m.id;
  },
  start() { startBattle(); },
  move(el) {
    const b = S.battle;
    if (!canPlayerAct(b)) return;
    const r = IV.moveMech(b, b.player, { c: Number(el.dataset.c), r: Number(el.dataset.r) });
    if (!r.ok) toast(r.reason);
  },
  pick(el) {
    const b = S.battle; if (!canPlayerAct(b)) return;
    const uid = el.dataset.uid;
    if (S.picks.has(uid)) S.picks.delete(uid); else S.picks.add(uid);
  },
  skipMove() { const b = S.battle; if (canPlayerAct(b)) IV.skipMove(b, b.player); },
  fire() {
    const b = S.battle; if (!canPlayerAct(b) || b.player.hasAttacked) return;
    const uids = Array.from(S.picks);
    if (!uids.length) return toast('발사할 무기를 선택하세요.');
    const precise = S.fireMode === 'precise';
    if (precise && !S.aimPart) return toast('정밀 사격할 부위를 먼저 지정하세요.');
    if (precise && curTarget(b).parts[S.aimPart].destroyed) { S.aimPart = null; return toast('이미 파괴된 부위는 공격할 수 없습니다.'); }
    if (!b.player.hasMoved) IV.skipMove(b, b.player);
    const pre = snapshot(b);
    const part = precise ? S.aimPart : null, tgt = curTarget(b);
    let opts = precise ? { mode: 'precise', part } : undefined;
    if (b.mode === '2v2') opts = Object.assign({}, opts || {}, { target: tgt });
    const r = IV.attack(b, b.player, uids, opts);
    if (!r.ok) return toast(r.reason);
    S.picks.clear();
    playVolley(b, b.player, tgt, r.shots, pre, { precise, part })
      .then(() => { if (S.battle === b && b.over) scheduleResult(b); });
  },
  aimpart(el) {
    const b = S.battle; if (!canPlayerAct(b) || b.player.hasAttacked) return;
    const loc = el.dataset.loc;
    if (curTarget(b).parts[loc].destroyed) return toast(P[loc].name + '은(는) 이미 파괴되어 선택할 수 없습니다.');
    if (S.fireMode === 'precise' && S.aimPart === loc) { S.fireMode = 'normal'; S.aimPart = null; return; } // 같은 부위를 다시 누르면 해제
    S.fireMode = 'precise'; S.aimPart = loc;
  },
  fireMode(el) {
    const b = S.battle; if (!canPlayerAct(b) || b.player.hasAttacked) return;
    S.fireMode = el.dataset.mode === 'precise' ? 'precise' : 'normal';
    if (S.fireMode === 'normal') S.aimPart = null;
  },
  animToggle() { S.anim = !S.anim; saveAnim(S.anim); FX.setEnabled(S.anim); toast('전투 연출 ' + (S.anim ? '켜짐' : '꺼짐')); },
  fxskip() { FX.skip(); },
  endTurn() {
    const b = S.battle; if (!canPlayerAct(b)) return;
    S.picks.clear();
    if (b.mode === '2v2') IV.endUnit(b, b.player); // 내 기체의 행동을 마치면 아군 AI → 적1 → 적2 순서로 진행
    else { if (!b.player.hasMoved) IV.skipMove(b, b.player); b.player.hasAttacked = true; IV.endTurn(b); }
    if (!b.over) runAiPhases(b);
  },
  abort() {
    if (!S.confirmAbort) { S.confirmAbort = true; setTimeout(() => { S.confirmAbort = false; if (S.view === 'battle') render(); }, 3000); return; }
    FX.clear(); S.pre = null; S.fxBusy = false; S.fireMode = 'normal'; S.aimPart = null; S.actor = null; S.inspect = null; S.target = null;
    S.confirmAbort = false; S.battle = null; S.busy = false; S.view = 'brief';
  }
};

/* ---------- 화면 전환 / 이벤트 ---------- */
function renderNav() {
  const b = S.battle;
  const items = [['hangar', '1', '격납고', true], ['brief', '2', '출격 준비', true], ['battle', '3', '전장', !!b], ['result', '4', '결과', !!(b && b.over)]];
  $('#steps').innerHTML = items.map(i => '<button class="step' + (S.view === i[0] ? ' on' : '') + '" data-act="nav" data-view="' + i[0] + '"' + (i[3] ? '' : ' disabled') + '><b>' + i[1] + '</b>' + i[2] + '</button>').join('')
    + '<button class="step fxt' + (S.anim ? ' on' : '') + '" data-act="animToggle" aria-pressed="' + S.anim + '" title="발사·피격 연출을 켜거나 끕니다"><b>' + (S.anim ? '●' : '○') + '</b>연출 ' + (S.anim ? 'ON' : 'OFF') + '</button>';
}
function focusSelector(el) {
  if (!el || !el.dataset || !el.dataset.act) return null;
  return '[' + Object.keys(el.dataset).map(k => 'data-' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()) + '="' + String(el.dataset[k]).replace(/"/g, '\\"') + '"]').join('[');
}
function render() {
  const sel = focusSelector(document.activeElement);
  ['hangar', 'brief', 'battle', 'result'].forEach(v => { $('#v-' + v).hidden = S.view !== v; });
  document.body.classList.toggle('noanim', !S.anim);
  if (S.view !== 'battle') FX.clear();
  renderNav();
  if (S.view === 'hangar') renderHangar();
  else if (S.view === 'brief') renderBrief();
  else if (S.view === 'battle') renderBattle();
  else renderResult();
  S.hitFlash = {};
  if (sel) { try { const n = document.querySelector(sel.replace(/^\[/, '[')); if (n && !n.disabled) n.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (HANGAR_ACTS[a]) { HANGAR_ACTS[a](el); saveDesign(); render(); return; }
  if (ACTS[a]) { ACTS[a](el); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target;
  if (el && el.matches && el.matches('polygon[data-act], .wrow[data-act], .dp[data-act], .mp[data-act], .selhit[data-act], .ru[data-act]')) { e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'mechName') { S.design.name = e.target.value.slice(0, 24) || '무명 기체'; saveDesign(); }
});
FX.setEnabled(S.anim);
render();

</script>

</body></html>
