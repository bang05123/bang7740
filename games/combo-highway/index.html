<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>콤보 하이웨이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap">
<style>
/* Layout: 16:9 letterboxed canvas stage; DOM overlays for menus, pause, results and thumb pads */
:root{
  --ink:#0a1230;
  --navy:#132254;
  --sun:#ffd23a;
  --sun-deep:#c98d00;
  --hot:#ff3d68;
  --sky:#36c8ff;
  --mint:#40f2b4;
  --paper:#ffffff;
  --glass:rgba(10,20,52,.78);
  --f-disp:"Black Han Sans","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#fit{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:relative;overflow:hidden;touch-action:none;background:#7fd6ff;border-radius:.6em;box-shadow:0 0 0 .15em rgba(255,255,255,.08)}
#cv{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3em;
  background:linear-gradient(100deg,rgba(10,18,48,.86) 0%,rgba(10,18,48,.55) 55%,rgba(10,18,48,.25) 100%)}
.title{transform:skewX(-9deg);display:flex;flex-direction:column;gap:.1em}
.title .tag{font-family:var(--f-ui);font-size:1.5em;letter-spacing:.18em;color:var(--mint)}
.title h1{margin:0;font-family:var(--f-disp);font-weight:400;line-height:.92;font-size:8.2em;letter-spacing:-.01em}
.title h1 .a{color:var(--sun);text-shadow:.06em .06em 0 var(--hot),.12em .12em 0 rgba(0,0,0,.35)}
.title h1 .b{color:var(--paper);text-shadow:.06em .06em 0 var(--sky),.12em .12em 0 rgba(0,0,0,.35)}
.title .sub{font-size:1.6em;color:#cfe3ff;margin-top:.4em}
.panel{background:var(--glass);border:.15em solid rgba(255,255,255,.18);border-radius:1.1em;padding:1.6em 1.8em;
  display:flex;flex-direction:column;gap:1em;min-width:0;width:24em}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:1.5em;color:#bcd0f5}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:1.4em;color:var(--paper);font-variant-numeric:tabular-nums}
.btn{font-family:var(--f-disp);font-size:2.2em;border:0;border-radius:.45em;padding:.35em .8em;cursor:pointer;
  background:var(--sun);color:var(--ink);box-shadow:0 .16em 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(.12em);box-shadow:0 .04em 0 var(--sun-deep)}
.btn.alt{background:#2b3f86;color:var(--paper);box-shadow:0 .16em 0 #17245a;font-size:1.6em}
.btn:focus-visible,.icon:focus-visible,.tb:focus-visible{outline:.2em solid var(--mint);outline-offset:.15em}
.row{display:flex;gap:.8em;flex-wrap:wrap}
.row .btn{flex:1}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.45em .8em;font-size:1.25em;color:#d6e4ff;align-items:center}
.keys kbd{font-family:var(--f-ui);background:#24356f;border-radius:.3em;padding:.05em .45em;border-bottom:.15em solid #101a40;color:var(--paper);white-space:nowrap}
.keys .hd{grid-column:1/-1;color:var(--mint);letter-spacing:.1em;font-size:.9em;margin-top:.3em}
.icon{position:absolute;top:1em;right:1em;width:3.6em;height:3.6em;border-radius:.8em;border:.15em solid rgba(255,255,255,.5);
  background:rgba(10,20,52,.55);color:var(--paper);font-family:var(--f-disp);font-size:1em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.35em}
.icon i{display:block;width:.45em;height:1.5em;background:var(--paper);border-radius:.1em}
#pad{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;width:8.4em;height:8.4em;border-radius:50%;
  background:rgba(255,255,255,.16);border:.2em solid rgba(255,255,255,.55);color:var(--paper);
  font-family:var(--f-disp);font-size:1em;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb span{font-size:2.4em;line-height:1}
.tb.on{background:rgba(255,255,255,.4)}
#tL{left:1.6em;bottom:1.6em}
#tR{left:11.2em;bottom:1.6em}
#tJ{right:1.6em;bottom:1.6em;background:rgba(64,242,180,.22);border-color:rgba(64,242,180,.8)}
#tT{right:11.2em;bottom:2.6em;width:7em;height:7em;background:rgba(54,200,255,.2);border-color:rgba(54,200,255,.85)}
#tT span,#tJ span{font-size:1.9em}
#tT.ready{background:rgba(255,210,58,.45);border-color:var(--sun)}
.big{font-family:var(--f-disp);font-size:4.4em;margin:0;line-height:1;transform:skewX(-8deg);color:var(--sun);text-shadow:.05em .05em 0 var(--hot)}
.badge{display:inline-block;font-family:var(--f-disp);font-size:1.4em;background:var(--hot);color:var(--paper);padding:.15em .6em;border-radius:.4em;transform:skewX(-8deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6em 2em}
.col{display:flex;flex-direction:column;gap:.8em;align-items:flex-start}
#rotate{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;
  text-align:center;padding:2em;font-size:18px;z-index:5}
#rotate .ph{width:4em;height:6.5em;border:.25em solid var(--paper);border-radius:.6em;animation:spin 2.2s ease-in-out infinite}
#rotate p{margin:0;font-size:1.4em}
#rotate .btn{font-size:1.2em}
@keyframes spin{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}
</style>

<div id="fit">
  <div id="stage">
    <canvas id="cv" width="1280" height="720"></canvas>

    <div id="pad" hidden>
      <button class="tb" id="tL" aria-label="왼쪽 차선"><span>◀</span></button>
      <button class="tb" id="tR" aria-label="오른쪽 차선"><span>▶</span></button>
      <button class="tb" id="tT" aria-label="터보"><span>터보</span></button>
      <button class="tb" id="tJ" aria-label="점프"><span>점프</span></button>
    </div>

    <button class="icon" id="pauseBtn" aria-label="일시정지" hidden><i></i><i></i></button>

    <div class="screen" id="menu">
      <div class="title">
        <div class="tag">3 LANE ARCADE RACER</div>
        <h1><span class="a">콤보</span><br><span class="b">하이웨이</span></h1>
        <div class="sub">끼어들고, 스치고, 날아올라라.</div>
      </div>
      <div class="panel">
        <div class="stat">최고 점수 <b id="mBest">0</b></div>
        <div class="stat">보유 코인 <b id="mCoins">0</b></div>
        <button class="btn" id="btnPlay">출발!</button>
        <div class="keys">
          <span class="hd">PC</span>
          <span><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd></span><span>차선 변경</span>
          <span><kbd>Space</kbd></span><span>점프 (고깔·낮은 블록)</span>
          <span><kbd>Shift</kbd></span><span>터보 (게이지 가득)</span>
          <span><kbd>Esc</kbd></span><span>일시정지</span>
          <span class="hd">모바일</span>
          <span>◀ ▶ · 밀기</span><span>차선 변경 · 위로 밀면 점프</span>
        </div>
        <button class="btn alt" id="btnSound">소리 켜짐</button>
      </div>
    </div>

    <div class="screen" id="pauseScr" hidden>
      <div class="panel">
        <p class="big">일시정지</p>
        <button class="btn" id="btnResume">계속 달리기</button>
        <div class="row">
          <button class="btn alt" id="btnQuit">메인으로</button>
          <button class="btn alt" id="btnSound2">소리 켜짐</button>
        </div>
      </div>
    </div>

    <div class="screen" id="overScr" hidden>
      <div class="col">
        <p class="big">주행 종료</p>
        <span class="badge" id="newBest" hidden>신기록!</span>
      </div>
      <div class="panel">
        <div class="stat">최종 점수 <b id="rScore">0</b></div>
        <div class="grid">
          <div class="stat">주행 거리 <b id="rDist">0</b></div>
          <div class="stat">추월 <b id="rPass">0</b></div>
          <div class="stat">최고 콤보 <b id="rCombo">0</b></div>
          <div class="stat">획득 코인 <b id="rCoin">0</b></div>
        </div>
        <div class="stat">최고 점수 <b id="rBest">0</b></div>
        <div class="row">
          <button class="btn" id="btnRetry">다시 달리기</button>
          <button class="btn alt" id="btnMenu">메인</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="rotate" hidden>
  <div class="ph"></div>
  <p>휴대폰을 가로로 돌려주세요</p>
  <button class="btn" id="btnRotOk">이대로 할게요</button>
</div>

<script>
(()=>{
'use strict';
// ================= CONFIG =================
const W=1280,H=720,HOR=258,CAMH=5.2,CAMBACK=9,F=692,VIEW=250;
const LANES=[-3.6,0,3.6];
const PW=1.9,PL=4.3;
const JUMP_T=0.72,JUMP_H=1.75,TURBO_T=4,COMBO_T=3.2,LANE_T=0.17;
const FOG=[214,236,255];
const TYPES={
  compact:{w:1.7,len:3.7,h:1.5,bt:.9,cw:.86,c0:.25,c1:.78,vehicle:1,cols:[[255,214,64],[120,220,255],[255,255,255],[150,235,140]]},
  sedan:{w:1.85,len:4.6,h:1.45,bt:.82,cw:.84,c0:.22,c1:.7,vehicle:1,cols:[[70,120,255],[240,240,245],[48,56,80],[200,60,70],[150,160,180]]},
  sports:{w:1.95,len:4.4,h:1.15,bt:.68,cw:.78,c0:.3,c1:.68,vehicle:1,spoiler:1,cols:[[255,140,0],[30,220,160],[250,70,180],[255,230,0]]},
  van:{w:1.95,len:4.9,h:2.05,bt:.95,vehicle:1,cols:[[245,245,240],[90,180,255],[255,200,90]]},
  truck:{w:2.4,len:9,h:3.3,vehicle:1,cols:[[60,140,230],[235,80,60],[250,250,250],[60,180,110]]},
  cone:{w:2.6,len:.7,h:.75,low:1},
  block:{w:2.7,len:1.1,h:.65,low:1},
  works:{w:2.9,len:13,h:1.35},
  player:{w:PW,len:PL,h:1.2,bt:.72,cw:.8,c0:.28,c1:.7,spoiler:1}
};

// ================= HELPERS =================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const shade=(c,k)=>k>0?mix(c,[255,255,255],k):mix(c,[0,0,0],-k);
const fogT=dz=>{const t=(dz-70)/(VIEW-70);return t<=0?0:Math.min(.9,t*t*.55+t*.35)};
const fc=(c,ft)=>rgb(mix(c,FOG,ft));
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const fmt=n=>Math.floor(n).toLocaleString('ko-KR');
const pick=a=>a[(Math.random()*a.length)|0];

// ================= DOM / CANVAS =================
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d'),fit=$('fit');
let isTouch=matchMedia('(pointer:coarse)').matches;
let rotDismissed=false;
function resize(){
  const cs=getComputedStyle(fit);
  const aw=fit.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=fit.clientHeight;
  let sw=aw,sh=aw*9/16; if(sh>ah){sh=ah;sw=ah*16/9}
  sw=Math.max(200,Math.floor(sw)); sh=Math.max(112,Math.floor(sh));
  stage.style.width=sw+'px'; stage.style.height=sh+'px';
  const dpr=Math.min(window.devicePixelRatio||1,1.75);
  cv.width=Math.round(sw*dpr); cv.height=Math.round(sh*dpr);
  stage.style.fontSize=(16*sw/W)+'px';
  $('rotate').hidden=!(isTouch&&!rotDismissed&&innerHeight>innerWidth*1.05);
}
addEventListener('resize',resize);
$('btnRotOk').onclick=()=>{rotDismissed=true;resize()};

// ================= STORAGE =================
const KEY='comboHighway.v1';
let store={best:0,coins:0,muted:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

// ================= AUDIO =================
const AU={c:null,master:null,eng:null,engGain:null,engF:null,sub:null};
function auInit(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume().catch(()=>{});return}
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const c=new C(); AU.c=c;
    AU.master=c.createGain(); AU.master.gain.value=store.muted?0:.55; AU.master.connect(c.destination);
    AU.eng=c.createOscillator(); AU.eng.type='sawtooth';
    AU.sub=c.createOscillator(); AU.sub.type='square';
    AU.engF=c.createBiquadFilter(); AU.engF.type='lowpass'; AU.engF.frequency.value=500;
    AU.engGain=c.createGain(); AU.engGain.gain.value=0;
    const sg=c.createGain(); sg.gain.value=.4;
    AU.eng.connect(AU.engF); AU.sub.connect(sg); sg.connect(AU.engF); AU.engF.connect(AU.engGain); AU.engGain.connect(AU.master);
    AU.eng.frequency.value=50; AU.sub.frequency.value=25;
    AU.eng.start(); AU.sub.start();
  }catch(e){AU.c=null}
}
function blip(f,dur,type='square',vol=.12,to=null,delay=0){
  if(!AU.c)return; const c=AU.c,t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol=.3,freq=1200,to=null){
  if(!AU.c)return; const c=AU.c,t=c.currentTime;
  const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(freq,t); if(to)f.frequency.exponentialRampToValueAtTime(to,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t);
}
const SFX={
  coin(){blip(988,.07,'square',.08);blip(1480,.12,'square',.08,null,.06)},
  pass(c,g){const f=420+Math.min(c,30)*22;blip(f,.09,'triangle',.14);if(g>=2){blip(f*1.5,.09,'triangle',.12,null,.07);blip(f*2,.14,'triangle',.1,null,.14)}},
  crash(){noise(.55,.5,900,120);blip(110,.4,'sawtooth',.2,40)},
  smash(){noise(.3,.4,1600,300);blip(220,.15,'square',.12,90)},
  jump(){blip(260,.22,'triangle',.14,620)},
  land(){noise(.12,.25,400)},
  turbo(){noise(.7,.35,300,3000);blip(180,.6,'sawtooth',.1,900)},
  power(){[660,880,1100,1320].forEach((f,i)=>blip(f,.1,'square',.07,null,i*.05))},
  beep(hi){blip(hi?880:440,hi?.4:.16,'square',.12)},
  shield(){blip(1200,.3,'sine',.15,300)}
};
function setMuted(m){
  store.muted=m; save();
  if(AU.master)AU.master.gain.value=m?0:.55;
  $('btnSound').textContent=$('btnSound2').textContent=m?'소리 꺼짐':'소리 켜짐';
}
$('btnSound').onclick=()=>{auInit();setMuted(!store.muted)};
$('btnSound2').onclick=()=>{auInit();setMuted(!store.muted)};

// ================= STATE =================
let state='menu',prevState='play';
let time=0,cdT=0,lastCd=0,endT=0;
const cam={x:0,z:-CAMBACK,shake:0,pull:0};
const P0=()=>({x:0,lane:1,fromX:0,tw:1,z:0,prevZ:0,speed:24,y:0,jt:0,tilt:0});
let player=P0();
let ents=[],items=[],pops=[],parts=[];
let score=0,dist=0,combo=0,maxCombo=0,comboT=0,passes=0,coins=0;
let gauge=0,turboT=0,shield=false,magT=0,boostT=0,invT=0,lives=3;
let diff=0,spawnAcc=0;
let clouds=[];
for(let i=0;i<7;i++)clouds.push({x:rand(0,W+300),y:rand(30,170),s:rand(.6,1.4),v:rand(4,12)});

function resetRun(){
  player=P0(); player.speed=0;
  ents=[];items=[];pops=[];parts=[];
  score=0;dist=0;combo=0;maxCombo=0;comboT=0;passes=0;coins=0;
  gauge=0;turboT=0;shield=false;magT=0;boostT=0;invT=0;lives=3;
  diff=0;spawnAcc=30;cam.x=0;cam.z=-CAMBACK;cam.shake=0;cam.pull=0;
  keys.clear();
}

// ================= INPUT =================
const keys=new Set();
function moveLane(d){
  if(state!=='play')return;
  const nl=clamp(player.lane+d,0,2);
  if(nl===player.lane){player.tilt+=d*.05;return}
  player.lane=nl; player.fromX=player.x; player.tw=0;
}
function jump(){
  if(state!=='play'||player.jt>0)return;
  player.jt=1e-4; SFX.jump();
}
function turbo(){
  if(state!=='play'||turboT>0||gauge<100)return;
  turboT=TURBO_T; gauge=0; SFX.turbo(); popup('TURBO!',[54,200,255],1.2);
}
function togglePause(){
  if(state==='play'||state==='countdown'){prevState=state;state='pause';showScreens()}
  else if(state==='pause'){state=prevState;showScreens()}
}
addEventListener('keydown',e=>{
  const k=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(k))e.preventDefault();
  if(e.repeat)return;
  auInit();
  if(k==='Escape'||k==='KeyP'){togglePause();return}
  if(state==='menu'&&(k==='Enter'||k==='Space')){startRun();return}
  if(state==='over'&&k==='Enter'){startRun();return}
  if(k==='ArrowLeft'||k==='KeyA')moveLane(-1);
  else if(k==='ArrowRight'||k==='KeyD')moveLane(1);
  else if(k==='Space'||k==='ArrowUp'||k==='KeyW')jump();
  else if(k==='ShiftLeft'||k==='ShiftRight')turbo();
});
addEventListener('blur',()=>{if(state==='play'||state==='countdown')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='countdown'))togglePause()});

function bindPad(id,fn){
  const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();auInit();b.classList.add('on');fn()});
  const off=()=>b.classList.remove('on');
  b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
}
bindPad('tL',()=>moveLane(-1));bindPad('tR',()=>moveLane(1));bindPad('tJ',jump);bindPad('tT',turbo);
stage.addEventListener('contextmenu',e=>e.preventDefault());
// swipe on the road
let sw=null;
cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY,t:performance.now()};if(e.pointerType==='touch'){isTouch=true;showScreens()}});
cv.addEventListener('pointerup',e=>{
  if(!sw)return; const dx=e.clientX-sw.x,dy=e.clientY-sw.y,s=parseFloat(stage.style.fontSize)/16; sw=null;
  const th=40*Math.max(.5,s);

function pickType(){
  const d=dist,w=[
    ['compact',3],['sedan',3],['sports',2],['van',1.5],['truck',1+diff*1.5],
    ['cone',d>200?1.3:0],['block',d>450?1.1:0],['works',d>900?.8:0],['slow',d>550?.9:0]
  ];
  let tot=0;for(const x of w)tot+=x[1];
  let r=Math.random()*tot;for(const x of w){r-=x[1];if(r<=0)return x[0]}
  return 'sedan';
}
function trafficSpeed(){return 12+6*diff}
function makeEnt(type,lane,z){
  let slow=false;
  if(type==='slow'){slow=true;type=Math.random()<.5?'van':'truck'}
  const T=TYPES[type];
  const e={type,lane,x:LANES[lane],z,len:T.len,w:T.w,h:T.h,vehicle:!!T.vehicle,slow,
    color:T.cols?pick(T.cols):null,cab:pick([[240,240,245],[255,210,60],[220,60,60]]),
    speed:0,base:0,passed:false,minGap:Infinity,hitP:false,jumped:false,flying:false,yOff:0,vx:0,vy:0};
  if(e.vehicle){e.base=slow?trafficSpeed()*.4:trafficSpeed()*rand(.85,1.15);e.speed=e.base}
  return e;
}
function spawnRow(){
  const zS=player.z+VIEW-12;
  const occ=[false,false,false];
  for(const e of ents){if(!e.flying&&e.z+e.len>zS-36)occ[e.lane]=true}
  const free=[0,1,2].filter(l=>!occ[l]);
  if(free.length<=1)return;
  for(let i=free.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[free[i],free[j]]=[free[j],free[i]]}
  let nb=Math.random()<.25+diff*.5?2:1; nb=Math.min(nb,free.length-1);
  for(let i=0;i<nb;i++)ents.push(makeEnt(pickType(),free[i],zS+rand(0,6)));
  const open=free[nb];
  const r=Math.random();
  if(r<.5){
    const n=4+((Math.random()*3)|0);
    for(let i=0;i<n;i++)items.push({kind:'coin',x:LANES[open],z:zS+4+i*5});
  }else if(r<.62+diff*.06){
    items.push({kind:pick(['turbo','turbo','shield','magnet','boost']),x:LANES[open],z:zS+8});
  }
}

function mult(){return(1+Math.min(combo,40)*.1)*(boostT>0?2:1)*(turboT>0?1.5:1)}
function popup(text,col,size=1,sub=''){pops.push({text,sub,col,t:0,size,x:0})}
function burst(x,y,n,cols,spd=420,life=.6,size=6){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.3,life,max:life,col:pick(cols),size:rand(.5,1)*size})}
}
function P(x,y,z){const s=F/(z-cam.z);return[W/2+(x-cam.x)*s,HOR+(CAMH-y)*s,s]}
function playerScreen(){return P(player.x,player.y+.6,player.z)}

function fling(e){

}
function award(e,g){
  combo++; maxCombo=Math.max(maxCombo,combo); comboT=COMBO_T; passes++;
  const base=[100,250,600,400][g],lab=['NICE','GREAT','PERFECT','AIR!'][g];
  const cols=[[255,255,255],[64,242,180],[255,210,58],[54,200,255]];
  const pts=Math.round(base*mult()); score+=pts;
  gauge=Math.min(100,gauge+[3,6,12,10][g]+(combo%10===0?15:0));
  popup(lab,cols[g],g>=2?1.25:1,'+'+fmt(pts));
  if(combo>1&&combo%10===0)popup(combo+' COMBO!',[255,61,104],1.4);

}
function hit(e){
  const ps=playerScreen();
  if(turboT>0){
    fling(e); const pts=Math.round(300*mult()); score+=pts; combo++;comboT=COMBO_T;maxCombo=Math.max(maxCombo,combo);
    popup('SMASH!',[255,140,0],1.2,'+'+fmt(pts)); SFX.smash(); cam.shake=Math.max(cam.shake,.25);
    burst(ps[0],ps[1]-40,18,['#ffd23a','#ff8a00','#fff'],520); return;
  }

  if(shield){shield=false;fling(e);invT=.9;popup('방어!',[64,242,255],1.1);SFX.shield();burst(ps[0],ps[1]-40,22,['#7ff','#fff'],480);return}
  lives--; fling(e); player.speed*=.45; cam.shake=.6; invT=1.6; combo=0; comboT=0;
  SFX.crash(); burst(ps[0],ps[1]-40,34,['#ffd23a','#ff5a2a','#fff','#555'],620,.8,8);
  if(lives<=0){state='crash';endT=1.2;showScreens()}
  else popup('쾅!',[255,61,104],1.2,'남은 차량 '+lives);
}
function take(it){
  it.taken=true; const p=P(it.x,1,it.z);
  if(it.kind==='coin'){coins++;score+=10*mult();SFX.coin();burst(p[0],p[1],6,['#ffd23a','#fff3a0'],200,.35,4);return}
  SFX.power(); burst(p[0],p[1],16,['#fff','#40f2b4','#36c8ff'],320,.5,5);
  if(it.kind==='turbo'){gauge=Math.min(100,gauge+40);popup('터보 +40',[54,200,255])}
  else if(it.kind==='shield'){shield=true;popup('보호막',[64,242,255])}
  else if(it.kind==='magnet'){magT=8;popup('자석',[255,90,110])}
  else if(it.kind==='boost'){boostT=8;popup('점수 x2',[190,120,255])}
}

function update(dt){
  time+=dt;
  for(const c of clouds){c.x-=c.v*dt;if(c.x<-200){c.x=W+200;c.y=rand(30,170)}}
  if(state==='pause')return;
  const sim=state==='crash'?dt*.35:dt;

  if(state==='menu'||state==='over'){
    player.speed=24; player.z+=player.speed*dt;
  }
  if(state==='countdown'){
    cdT-=dt; const c=Math.ceil(cdT);
    if(c!==lastCd&&c>0){lastCd=c;SFX.beep(false)}
    if(cdT<=0){state='play';SFX.beep(true);popup('GO!',[255,210,58],1.6);showScreens()}
  }
  if(state==='play'||state==='crash'){
    diff=1-Math.exp(-dist/2600);
    const base=34+40*diff;
    const target=state==='crash'?0:base+(turboT>0?26:0);
    if(player.speed<target)player.speed=Math.min(target,player.speed+(turboT>0?45:16)*sim);
    else player.speed=Math.max(target,player.speed-(state==='crash'?40:22)*sim);
    player.prevZ=player.z; player.z+=player.speed*sim; dist=player.z;
    if(state==='play')score+=player.speed*sim*.5*(boostT>0?2:1);

    // lane tween
    if(player.tw<1){player.tw=Math.min(1,player.tw+sim/LANE_T);const k=1-Math.pow(1-player.tw,3);player.x=player.fromX+(LANES[player.lane]-player.fromX)*k}
    else player.x=LANES[player.lane];
    // jump
    if(player.jt>0){player.jt+=sim;const t=player.jt/JUMP_T;
      if(t>=1){player.jt=0;player.y=0;cam.shake=Math.max(cam.shake,.14);SFX.land();const ps=P(player.x,0,player.z);burst(ps[0],ps[1],12,['#ddd','#bbb','#fff'],220,.4,6)}
      else player.y=4*JUMP_H*t*(1-t)}
    // timers
    if(turboT>0)turboT=Math.max(0,turboT-sim);
    if(magT>0)magT=Math.max(0,magT-sim);
    if(boostT>0)boostT=Math.max(0,boostT-sim);
    if(invT>0)invT=Math.max(0,invT-sim);
    if(comboT>0){comboT-=sim;if(comboT<=0){comboT=0;if(combo>=3)popup('콤보 끊김',[180,190,220],.8);combo=0}}

    // spawn
    if(state==='play'){spawnAcc+=Math.max(0,player.speed-trafficSpeed())*sim;
      const gap=62-34*diff; if(spawnAcc>=gap){spawnAcc=0;spawnRow()}}

    // traffic with anti-wall guard
    for(const e of ents){
      if(e.flying){e.x+=e.vx*sim;e.yOff+=e.vy*sim;e.vy-=22*sim;e.z+=e.speed*sim;e.speed*=Math.pow(.6,sim);
        if(e.yOff<=0&&e.vy<0){e.yOff=0;e.vy=-e.vy*.25;e.vx*=.5}continue}
      if(!e.vehicle)continue;
      let v=e.base;
      const ahead=[null,null,null];
      for(const f of ents){
        if(f===e||f.flying)continue;
        const d=f.z-e.z;
        if(f.lane===e.lane){const g=f.z-(e.z+e.len);if(g>-.5&&g<8)v=Math.min(v,f.speed)}
        else if(d>-f.len-2&&d<36){if(!ahead[f.lane]||f.speed<ahead[f.lane].speed)ahead[f.lane]=f}
      }
      const others=[0,1,2].filter(l=>l!==e.lane);
      if(ahead[others[0]]&&ahead[others[1]])v=Math.min(v,ahead[others[0]].speed,ahead[others[1]].speed);
      e.speed+=(v-e.speed)*Math.min(1,sim*4);
      e.z+=e.speed*sim;
    }

    // collisions, passes
    if(state==='play'){
      for(const e of ents){
        if(e.flying)continue;
        const ez0=e.z,ez1=e.z+e.len;
        const over=ez0<player.z+PL&&ez1>player.prevZ-e.speed*sim;
        const dx=Math.abs(e.x-player.x),lat=(PW+e.w)/2;
        if(over){
          const g=dx-lat; if(g<e.minGap)e.minGap=g;
          if(dx<lat*.9){
            if(player.y>e.h-.05){if(TYPES[e.type].low)e.jumped=true}
            else hit(e);
          }
        }
        if(state!=='play')break;
        if(!e.passed&&ez1<player.z){
          e.passed=true;
          if(!e.hitP){
            if(e.vehicle)award(e,e.minGap<.7?2:e.minGap<2?1:0);
            else if(e.jumped)award(e,3);
          }
        }
      }
      // items
      for(const it of items){
        if(it.taken)continue;
        const dz=it.z-player.z;
        if(magT>0&&it.kind==='coin'&&dz<45&&dz>-1){it.x+=(player.x-it.x)*Math.min(1,sim*6);it.z-=26*sim}
        const d2=it.z-player.z;
        if(d2<PL+.6&&it.z>player.prevZ-.6&&Math.abs(it.x-player.x)<1.6&&player.y<2.6)take(it);
      }
    }
    if(state==='crash'){endT-=dt;if(endT<=0)endRun()}
    ents=ents.filter(e=>e.z+e.len>cam.z+.5&&Math.abs(e.x)<40);
    items=items.filter(it=>!it.taken&&it.z>cam.z+1);
  }

  // tilt & camera
  const tt=clamp((LANES[player.lane]-player.x)*.06,-.13,.13);
  player.tilt+=(tt-player.tilt)*Math.min(1,dt*12);
  cam.x+=(player.x*.55-cam.x)*Math.min(1,dt*8);
  cam.pull+=((turboT>0?1:0)-cam.pull)*Math.min(1,dt*3);
  cam.z=player.z-CAMBACK-cam.pull*1.6;
  cam.shake=Math.max(0,cam.shake-dt*1.6);

  for(const p of pops)p.t+=dt;
  pops=pops.filter(p=>p.t<1.1);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  engine();
}
function engine(){
  if(!AU.c)return;
  const t=AU.c.currentTime,run=state==='play'||state==='countdown'||state==='crash';
  const f=38+player.speed*1.25+(turboT>0?24:0);
  AU.eng.frequency.setTargetAtTime(f,t,.08); AU.sub.frequency.setTargetAtTime(f/2,t,.08);
  AU.engF.frequency.setTargetAtTime(400+player.speed*12+(turboT>0?900:0),t,.1);

const bg=document.createElement('canvas'); bg.width=W+240; bg.height=HOR+2;
(function paintBg(){

function quad(a,b,c,d,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill()}
function C(base,ft,rear){return{rear:fc(rear||base,ft),top:fc(shade(base,.24),ft),side:fc(shade(base,-.3),ft)}}
function box(x,hw,y0,y1,zr,zf,cols){
  const dzr=zr-cam.z; if(dzr<.6)return null;
  const sr=F/dzr,sf=F/(zf-cam.z);
  const xl=x-hw,xr=x+hw;
  const rl=W/2+(xl-cam.x)*sr,rr=W/2+(xr-cam.x)*sr,rt=HOR+(CAMH-y1)*sr,rb=HOR+(CAMH-y0)*sr;
  const fl=W/2+(xl-cam.x)*sf,fr=W/2+(xr-cam.x)*sf,ftp=HOR+(CAMH-y1)*sf,fb=HOR+(CAMH-y0)*sf;
  if(xl>cam.x)quad([rl,rb],[rl,rt],[fl,ftp],[fl,fb],cols.side);
  if(xr<cam.x)quad([rr,rb],[rr,rt],[fr,ftp],[fr,fb],cols.side);
  if(y1<CAMH)quad([rl,rt],[rr,rt],[fr,ftp],[fl,ftp],cols.top);
  ctx.fillStyle=cols.rear;ctx.fillRect(rl,rt,rr-rl,rb-rt);

function drawRoad(){
  const SL=4,start=Math.floor(cam.z/SL)*SL,n0=Math.ceil(VIEW/SL)+1;
  const X=(x,s)=>W/2+(x-cam.x)*s;
  for(let n=n0;n>=0;n--){
    const za=start+n*SL,zb=za+SL;
    let dza=za-cam.z,dzb=zb-cam.z;
    if(dzb<=.5)continue; if(dza<.5)dza=.5;
    const sa=F/dza,sb=F/dzb,ya=HOR+CAMH*sa,yb=HOR+CAMH*sb;
    if(yb>H)continue;
    const idx=Math.floor(za/SL),alt=idx&1,ft=fogT(dza);
    ctx.fillStyle=fc(alt?[96,206,92]:[84,192,84],ft);
    ctx.fillRect(0,yb,W,Math.min(ya,H)-yb+1);
    const seg=(x0,x1,col)=>quad([X(x0,sa),ya],[X(x1,sa),ya],[X(x1,sb),yb],[X(x0,sb),yb],col);
    seg(-6.4,6.4,fc(alt?[255,255,255]:[235,55,70],ft));
    seg(-5.8,5.8,fc(alt?[88,96,116]:[82,90,110],ft));

    // guardrails (inner face)
    const rail=(xr)=>{const a1=[X(xr,sa),HOR+(CAMH-.45)*sa],a2=[X(xr,sa),HOR+(CAMH-.85)*sa],b2=[X(xr,sb),HOR+(CAMH-.85)*sb],b1=[X(xr,sb),HOR+(CAMH-.45)*sb];quad(a1,a2,b2,b1,fc(alt?[220,228,240]:[200,210,226],ft))};
    rail(-7.2);rail(7.2);

}

function drawVehicle(x,z,y,type,col,ft,e,isPlayer){

  list.push({z:player.z,k:'player'});
  list.sort((a,b)=>b.z-a.z);

    switch(it.k){
      case'lamp':drawLamp(it.o,ft);break;
      case'tree':drawTree(it.o,ft);break;
      case'bld':drawBuilding(it.o,ft);break;
      case'item':drawItem(it.o);break;
      case'ent':{const e=it.o;
        if(e.type==='cone')drawCones(e,ft);else if(e.type==='block')drawBlock(e,ft);else if(e.type==='works')drawWorks(e,ft);
        else drawVehicle(e.x,e.z,e.yOff,e.type,e.color,ft,e,false);break}
    }
  }
  speedLines();
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}
  ctx.globalAlpha=1;
  drawPops();
  ctx.restore();
  if(state==='play'||state==='countdown'||state==='pause'||state==='crash')hud();
  if(state==='countdown'){
    const c=Math.ceil(cdT),k=cdT-Math.floor(cdT);
    ctx.save();ctx.translate(W/2,H*.44);const s=1+k*.6;ctx.scale(s,s);ctx.globalAlpha=Math.min(1,k*2+.3);
    txt(String(c),0,40,140,'#ffd23a','center','"Black Han Sans"',14);ctx.restore();
  }
}

// ================= LOOP =================
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  update(dt);render();
  requestAnimationFrame(frame);
}
setMuted(store.muted);
resize();showScreens();
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Black Han Sans"').catch(()=>{});document.fonts.load('20px "Do Hyeon"').catch(()=>{})}
requestAnimationFrame(frame);
})();
</script>
